<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3v3 RPG - Paper Cutout</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        body {
            background-color: #2b2b2b;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        /* Tela do Jogo estilo Caderno */
        #game-container {
            width: 800px;
            height: 500px;
            background-color: #f4ecd8;
            background-image: 
                linear-gradient(#999 0.05em, transparent 0.05em),
                linear-gradient(90deg, #999 0.05em, transparent 0.05em);
            background-size: 20px 20px;
            border: 8px solid #5c4033;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            position: relative;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            overflow: hidden;
        }

        /* Campo de Batalha */
        #battle-field {
            flex: 1;
            position: relative;
            display: flex;
            justify-content: space-around;
            align-items: center;
        }

        /* Sprite do Personagem estilo Recorte de Papel */
        .paper-character {
            width: 120px;
            height: 160px;
            position: relative;
            filter: drop-shadow(4px 8px 0px rgba(0,0,0,0.25));
            transition: transform 0.1s ease-in-out;
        }

        .paper-character img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        /* Animação de Ataque (Pulo do Papel) */
        .attacking {
            transform: translateX(60px) rotate(5deg) scale(1.1);
        }

        /* HUD de HP */
        .hp-bar-container {
            width: 100%;
            background: #d3d3d3;
            border: 2px solid #000;
            height: 16px;
            margin-top: 5px;
            border-radius: 4px;
            overflow: hidden;
        }

        .hp-bar-fill {
            height: 100%;
            background: #4caf50;
            width: 100%;
            transition: width 0.3s;
        }

        /* Painel de Controle Inferior */
        #control-panel {
            height: 160px;
            background: #e8dfc8;
            border-top: 4px dashed #5c4033;
            padding: 10px;
            display: flex;
            gap: 10px;
        }

        #log-box {
            flex: 1;
            background: #fff;
            border: 2px solid #5c4033;
            padding: 10px;
            font-size: 14px;
            border-radius: 6px;
            overflow-y: auto;
        }

        #action-buttons {
            flex: 1;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }

        button {
            background: #faf0d7;
            border: 2px solid #5c4033;
            font-family: inherit;
            font-weight: bold;
            font-size: 13px;
            cursor: pointer;
            border-radius: 6px;
            box-shadow: 2px 2px 0px #5c4033;
            transition: all 0.1s;
        }

        button:active {
            transform: translate(2px, 2px);
            box-shadow: 0px 0px 0px #5c4033;
        }

        button:hover {
            background: #fff;
        }
    </style>
</head>
<body>

<div id="game-container">
    <!-- Campo de Batalha -->
    <div id="battle-field">
        <!-- Time dos Jogadores (Lado Esquerdo) -->
        <div id="hero-team">
            <div id="ysma-character" class="paper-character">
                <img src="ysma.png" alt="Ysma" id="ysma-img">
                <div style="font-weight: bold; font-size: 12px; text-align: center;">Ysma</div>
                <div class="hp-bar-container">
                    <div id="ysma-hp" class="hp-bar-fill"></div>
                </div>
            </div>
        </div>

        <!-- Inimigo de Teste (Lado Direito) -->
        <div id="enemy-team">
            <div id="dummy-character" class="paper-character" style="filter: drop-shadow(-4px 8px 0px rgba(0,0,0,0.25));">
                <div style="width: 100px; height: 120px; background: #c2b280; border: 2px dashed #000; display: flex; align-items: center; justify-content: center; margin: 0 auto;">
                    👾 Boneco
                </div>
                <div style="font-weight: bold; font-size: 12px; text-align: center; margin-top: 5px;">Inimigo Teste</div>
                <div class="hp-bar-container">
                    <div id="enemy-hp" class="hp-bar-fill"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- Painel de Controle -->
    <div id="control-panel">
        <div id="log-box">
            <p><strong>Batalha iniciada!</strong> Escolha uma ação para Ysma.</p>
        </div>
        <div id="action-buttons">
            <button onclick="usarHabilidade('Atacar', 15, 'Físico')">Acerto Perfurante</button>
            <button onclick="usarHabilidade('Bola de Fogo', 45, 'Fogo')">Bola de Fogo</button>
            <button onclick="usarHabilidade('Raio de Gelo', 10, 'Gelo')">Raio de Gelo</button>
            <button onclick="usarHabilidade('Explosão Prisma', 50, 'Mágico')">Quebra de Limites</button>
        </div>
    </div>
</div>

<script>
    let enemyMaxHp = 150;
    let enemyCurrentHp = 150;

    function log(mensagem) {
        const logBox = document.getElementById('log-box');
        logBox.innerHTML += `<p style="margin-bottom: 4px;">> ${mensagem}</p>`;
        logBox.scrollTop = logBox.scrollHeight;
    }

    function usarHabilidade(nome, dano, elemento) {
        const ysma = document.getElementById('ysma-character');
        
        // Animação de pulo de papel
        ysma.classList.add('attacking');
        setTimeout(() => ysma.classList.remove('attacking'), 200);

        // Aplicação do Dano
        enemyCurrentHp = Math.max(0, enemyCurrentHp - dano);
        const porcentagemHp = (enemyCurrentHp / enemyMaxHp) * 100;
        document.getElementById('enemy-hp').style.width = porcentagemHp + '%';

        log(`<strong>Ysma</strong> usou <span>${nome}</span>! Causou <strong>${dano}</strong> de dano (${elemento}).`);

        if (enemyCurrentHp === 0) {
            log(`<span style="color: red;">O Inimigo de Teste foi derrotado!</span>`);
        }
    }
</script>

</body>
</html>
