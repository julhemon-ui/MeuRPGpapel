<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3v3 Paper RPG</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        body { background: #2b2b2b; font-family: sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        #game { width: 95%; max-width: 500px; background: #f4ecd8; border: 4px solid #5c4033; border-radius: 8px; padding: 15px; }
        .flex { display: flex; justify-content: space-between; margin-bottom: 15px; }
        .box { width: 45%; text-align: center; background: rgba(255,255,255,0.5); padding: 10px; border-radius: 6px; }
        .bar { width: 100%; height: 12px; background: #ccc; border: 1px solid #000; border-radius: 3px; overflow: hidden; margin-top: 5px; }
        .hp { height: 100%; background: #4caf50; width: 100%; transition: width 0.3s; }
        #turn { text-align: center; font-weight: bold; margin-bottom: 10px; color: #5c4033; }
        #log { background: #fff; border: 1px solid #5c4033; height: 90px; padding: 8px; font-size: 12px; overflow-y: auto; margin-bottom: 15px; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
        button { background: #faf0d7; border: 2px solid #5c4033; padding: 12px 5px; font-weight: bold; border-radius: 6px; font-size: 11px; }
        button:disabled { opacity: 0.5; background: #ddd; }
    </style>
</head>
<body>

<div id="game">
    <div id="turn">SEU TURNO</div>

    <div class="flex">
        <div class="box">
            <strong>Ysma</strong>
            <div class="bar"><div id="ysma-hp" class="hp"></div></div>
        </div>
        <div class="box">
            <strong>Golem Planta</strong>
            <div class="bar"><div id="enemy-hp" class="hp"></div></div>
        </div>
    </div>

    <div id="log">> A batalha começou!</div>

    <div class="grid">
        <button id="btn1" onclick="jogar('Ataque Básico', 15, 0, 'btn1')">Acerto Perfurante</button>
        <button id="btn2" onclick="jogar('Bola de Fogo', 35, 2, 'btn2')">Bola de Fogo 🔥 (2T)</button>
        <button id="btn3" onclick="jogar('Raio de Gelo', 20, 1, 'btn3')">Raio de Gelo ❄️️ (1T)</button>
        <button id="btn4" onclick="jogar('Explosão Prisma', 50, 3, 'btn4')">Explosão Prisma (3T)</button>
    </div>
</div>

<script>
    let ysmaHp = 100, enemyHp = 100;
    let turnosRecarga = { btn1: 0, btn2: 0, btn3: 0, btn4: 0 };

    function log(txt) {
        const l = document.getElementById('log');
        l.innerHTML += `<br>> ${txt}`;
        l.scrollTop = l.scrollHeight;
    }

    function atualizarBotoes(desabilitarTudo) {
        ['btn1', 'btn2', 'btn3', 'btn4'].forEach(id => {
            const btn = document.getElementById(id);
            if (desabilitarTudo) {
                btn.disabled = true;
            } else {
                btn.disabled = turnosRecarga[id] > 0;
            }
        });
    }

    function jogar(nome, dano, cd, btnId) {
        // Dano no Inimigo
        enemyHp = Math.max(0, enemyHp - dano);
        document.getElementById('enemy-hp').style.width = enemyHp + '%';
        log(`Ysma usou <b>${nome}</b> e causou ${dano} de dano!`);

        if (enemyHp <= 0) {
            log('<b style="color:green;">Vitória! O inimigo foi derrotado.</b>');
            atualizarBotoes(true);
            return;
        }

        // Aplica cooldown na habilidade usada
        if (cd > 0) turnosRecarga[btnId] = cd + 1;

        // Entra no Turno do Inimigo
        document.getElementById('turn').innerText = 'TURNO DO INIMIGO...';
        document.getElementById('turn').style.color = 'red';
        atualizarBotoes(true);

        // Ação do Inimigo após 1 segundo
        setTimeout(() => {
            let danoInimigo = 12;
            ysmaHp = Math.max(0, ysmaHp - danoInimigo);
            document.getElementById('ysma-hp').style.width = ysmaHp + '%';
            log(`Golem ataca Ysma e causa ${danoInimigo} de dano.`);

            if (ysmaHp <= 0) {
                log('<b style="color:red;">Derrota! Ysma caiu em batalha.</b>');
                return;
            }

            // Reduz recargas
            for (let id in turnosRecarga) {
                if (turnosRecarga[id] > 0) turnosRecarga[id]--;
            }

            // Devolve para o Turno do Jogador
            document.getElementById('turn').innerText = 'SEU TURNO';
            document.getElementById('turn').style.color = '#5c4033';
            atualizarBotoes(false);
        }, 1000);
    }
</script>

</body>
</html>
