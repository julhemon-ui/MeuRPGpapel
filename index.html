
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RPG 3v3 - Ysma Completa</title>
    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; user-select: none; }
        body { background: #121214; color: #fff; margin: 0; padding: 15px; display: flex; flex-direction: column; align-items: center; }
        h1 { margin-bottom: 5px; color: #ff9d00; font-size: 1.4rem; }
        
        .setup-container { background: #202024; padding: 10px; border-radius: 8px; margin-bottom: 15px; width: 100%; max-width: 800px; text-align: center; }
        input[type="text"] { width: 65%; padding: 8px; border-radius: 4px; border: 1px solid #444; background: #121214; color: #fff; font-size: 12px; }
        button { padding: 8px 12px; background: #8257e5; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; font-size: 12px; }

        .battle-field { display: flex; justify-content: space-between; width: 100%; max-width: 900px; margin-bottom: 15px; gap: 10px; }
        .team { flex: 1; background: #202024; padding: 10px; border-radius: 8px; border: 2px solid #323238; }
        .team-title { text-align: center; font-size: 1rem; margin-bottom: 10px; font-weight: bold; }
        .player-team { border-color: #00875f; }
        .enemy-team { border-color: #f75a68; }

        .card { background: #121214; padding: 8px; border-radius: 6px; margin-bottom: 8px; border: 1px solid #323238; display: flex; align-items: center; gap: 8px; font-size: 11px; }
        .card img { width: 40px; height: 40px; border-radius: 50%; object-fit: cover; border: 2px solid #ff9d00; }
        .card-info { flex: 1; }
        .hp-bar-bg { background: #323238; height: 10px; border-radius: 4px; overflow: hidden; margin-top: 4px; }
        .hp-bar-fill { background: #00b37e; height: 100%; width: 100%; transition: width 0.3s; }

        .actions-panel { background: #202024; padding: 12px; border-radius: 8px; width: 100%; max-width: 900px; display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
        .btn-skill { background: #29292e; border: 1px solid #00875f; color: #fff; padding: 10px; border-radius: 6px; cursor: pointer; text-align: left; font-size: 11px; }
        .btn-skill:hover { background: #00875f; }
        .btn-limit { grid-column: span 2; border-color: #ff9d00; background: #321b00; text-align: center; }
        .btn-limit:hover { background: #ff9d00; color: #000; }

        #log { background: #121214; width: 100%; max-width: 900px; height: 100px; overflow-y: auto; padding: 8px; border-radius: 8px; border: 1px solid #323238; margin-top: 10px; font-family: monospace; font-size: 0.8rem; }
        .log-entry { margin-bottom: 3px; }
    </style>
</head>
<body>

    <h1>⚔️ RPG Turnos 3v3 - Ysma Completa</h1>

    <div class="setup-container">
        <input type="text" id="sheetUrl" placeholder="Cole aqui o link .csv do Google Sheets">
        <button onclick="carregarDadosPlanilha()">Carregar Planilha</button>
    </div>

    <div class="battle-field">
        <div class="team player-team">
            <div class="team-title" style="color:#00b37e">Sua Equipe</div>
            <div id="player-cards"></div>
        </div>
        <div class="team enemy-team">
            <div class="team-title" style="color:#f75a68">Inimigos</div>
            <div id="enemy-cards"></div>
        </div>
    </div>

    <div class="actions-panel" id="actionsPanel"></div>

    <div id="log">
        <div class="log-entry">> Batalha pronta com o kit completo da Ysma.</div>
    </div>

    <script>
        // Objeto Padrão com TODAS as 4 Habilidades (Atacar + H1 + H2 + H3 + Limit)
        let ysmaData = {
            Nome: "Ysma",
            Classe: "Maga / Controle Elemental",
            HP: 90, HP_Max: 90,
            DanoFisico: 15,
            ElementoBase: "Mágico",
            Fraqueza: "Purificação",
            Imunidade: "Fogo",
            FotoURL: "https://via.placeholder.com/150/ff4500/ffffff?text=Ysma",
            Habilidades: [
                { nome: "Acerto Perfurante", dano: 15, elem: "Físico", cd: 0 },
                { nome: "Bola de Fogo", dano: 45, elem: "Fogo", cd: 2 },
                { nome: "Raio de Gelo", dano: 10, elem: "Gelo", cd: 4 },
                { nome: "Furacão", dano: 25, elem: "Vento", cd: 4 }
            ],
            Limit: { nome: "Explosão de Cristal Prisma", dano: 50, elem: "Mágico" }
        };

        let playerTeam = [ Object.assign({}, ysmaData) ];
        let enemyTeam = [
            { Nome: "Treino A", HP: 100, HP_Max: 100, Fraqueza: "Fogo", Imunidade: "Nenhuma" },
            { Nome: "Treino B", HP: 100, HP_Max: 100, Fraqueza: "Vento", Imunidade: "Fogo" },
            { Nome: "Treino C", HP: 100, HP_Max: 100, Fraqueza: "Gelo", Imunidade: "Nenhuma" }
        ];

        function log(msg) {
            const logDiv = document.getElementById("log");
            logDiv.innerHTML += `<div class="log-entry">> ${msg}</div>`;
            logDiv.scrollTop = logDiv.scrollHeight;
        }

        async function carregarDadosPlanilha() {
            const url = document.getElementById("sheetUrl").value;
            if(!url) return alert("Cole o link CSV publicado do Sheets!");

            try {
                log("Lendo dados do Google Sheets...");
                let response = await fetch(url);
                let csvText = await response.text();
                
                let linhas = csvText.split("\n").map(row => row.split(","));
                let dadosYsma = linhas[1].map(c => c.trim());

                ysmaData = {
                    Nome: dadosYsma[0],
                    Classe: dadosYsma[1],
                    HP: parseInt(dadosYsma[2]), HP_Max: parseInt(dadosYsma[2]),
                    DanoFisico: parseInt(dadosYsma[3]),
                    ElementoBase: dadosYsma[4],
                    Fraqueza: dadosYsma[5],
                    Imunidade: dadosYsma[6],
                    FotoURL: dadosYsma[7],
                    Habilidades: [
                        { nome: "Acerto Perfurante", dano: parseInt(dadosYsma[3]), elem: "Físico", cd: 0 },
                        { nome: dadosYsma[8], dano: parseInt(dadosYsma[9]), elem: dadosYsma[10], cd: parseInt(dadosYsma[11]) },
                        { nome: dadosYsma[12], dano: parseInt(dadosYsma[13]), elem: dadosYsma[14], cd: parseInt(dadosYsma[15]) },
                        { nome: dadosYsma[16], dano: parseInt(dadosYsma[17]), elem: dadosYsma[18], cd: parseInt(dadosYsma[19]) }
                    ],
                    Limit: { nome: dadosYsma[20], dano: parseInt(dadosYsma[21]), elem: dadosYsma[22] }
                };

                playerTeam[0] = Object.assign({}, ysmaData);
                log(`✅ Dados de ${ysmaData.Nome} atualizados com as 3 habilidades!`);
                render();
            } catch (err) {
                log("❌ Erro ao ler planilha. Verifique as colunas.");
            }
        }

        function calcularDano(atacante, alvo, habilidade) {
            let danoFinal = habilidade.dano;

            if (alvo.Imunidade === habilidade.elem) {
                log(`🛡️ ${alvo.Nome} é IMUNE ao elemento ${habilidade.elem}! (0 de dano)`);
                return 0;
            }

            if (alvo.Fraqueza === habilidade.elem) {
                danoFinal += 30;
                log(`💥 FRAQUEZA! +30 de dano contra ${alvo.Nome} por ser fraco a ${habilidade.elem}!`);
            }

            return danoFinal;
        }

        function usarHabilidade(indexHab, alvoIndex = 0) {
            let ysma = playerTeam[0];
            let hab = ysma.Habilidades[indexHab];
            let alvo = enemyTeam[alvoIndex];

            if (alvo.HP <= 0) return log("Alvo já derrotado!");

            let dano = calcularDano(ysma, alvo, hab);
            alvo.HP = Math.max(0, alvo.HP - dano);

            log(`✨ ${ysma.Nome} usou [${hab.nome}] em ${alvo.Nome} causando ${dano} de dano!`);
            render();
        }

        function usarQuebraDeLimites() {
            let ysma = playerTeam[0];
            let limit = ysma.Limit;

            log(`🔥 QUEBRA DE LIMITES! ${ysma.Nome} invoca [${limit.nome}] atingindo o grupo!`);

            enemyTeam.forEach((alvo) => {
                if(alvo.HP > 0) {
                    let dano = calcularDano(ysma, alvo, limit);
                    alvo.HP = Math.max(0, alvo.HP - dano);
                    log(`  -> ${alvo.Nome} recebeu ${dano} de dano!`);
                }
            });

            render();
        }

        function render() {
            const pDiv = document.getElementById("player-cards");
            pDiv.innerHTML = playerTeam.map(p => `
                <div class="card">
                    <img src="${p.FotoURL}" alt="${p.Nome}">
                    <div class="card-info">
                        <strong>${p.Nome}</strong> (${p.Classe})<br>
                        HP: ${p.HP}/${p.HP_Max}
                        <div class="hp-bar-bg"><div class="hp-bar-fill" style="width:${(p.HP/p.HP_Max)*100}%"></div></div>
                    </div>
                </div>
            `).join('');

            const eDiv = document.getElementById("enemy-cards");
            eDiv.innerHTML = enemyTeam.map((e) => `
                <div class="card">
                    <div class="card-info">
                        <strong>${e.Nome}</strong> [Fraco: ${e.Fraqueza} | Imune: ${e.Imunidade}]<br>
                        HP: ${e.HP}/${e.HP_Max}
                        <div class="hp-bar-bg"><div class="hp-bar-fill" style="width:${(e.HP/e.HP_Max)*100}%; background:#f75a68"></div></div>
                    </div>
                </div>
            `).join('');

            const y = playerTeam[0];
            const btnPanel = document.getElementById("actionsPanel");
            btnPanel.innerHTML = `
                ${y.Habilidades.map((h, i) => `
                    <button class="btn-skill" onclick="usarHabilidade(${i}, 0)">
                        <b>${h.nome}</b><br><small>Dano:${h.dano} | Elem: ${h.elem} \vert{} CD:${h.cd}T</small>
                    </button>
                `).join('')}
                <button class="btn-skill btn-limit" onclick="usarQuebraDeLimites()">
                    💥 <b>${y.Limit.nome}</b><br><small>Dano em Área: ${y.Limit.dano} (${y.Limit.elem})</small>
                </button>
            `;
        }

        render();
    </script>
</body>
</html>
