<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3v3 Paper RPG - Seleção & Batalha</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        body { background: #1a1a1a; font-family: 'Courier New', Courier, monospace; color: #333; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 10px; }
        
        /* TELAS */
        .screen {
            width: 100%; max-width: 680px; background: #f4ecd8;
            background-image: linear-gradient(#ccc 0.05em, transparent 0.05em), linear-gradient(90deg, #ccc 0.05em, transparent 0.05em);
            background-size: 20px 20px; border: 5px solid #5c4033; border-radius: 12px; padding: 14px; display: flex; flex-direction: column; gap: 12px;
        }

        /* TELA DE SELEÇÃO */
        #select-screen { display: flex; }
        .select-header { text-align: center; color: #5c4033; border-bottom: 2px dashed #8b5a2b; padding-bottom: 8px; }
        .select-header h2 { font-size: 18px; }
        .select-header p { font-size: 12px; margin-top: 4px; }

        .roster-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 10px; }
        .roster-card {
            background: #fff8dc; border: 2px solid #5c4033; border-radius: 8px; padding: 8px; text-align: center;
            cursor: pointer; transition: transform 0.2s, border-color 0.2s;
        }
        .roster-card:hover { transform: translateY(-3px); border-color: #ff9800; }
        .roster-card.selected-ally { border: 3px solid #2196f3; background: #e3f2fd; }
        .roster-card.selected-enemy { border: 3px solid #f44336; background: #ffebee; }
        .roster-card h4 { font-size: 13px; color: #333; }
        .roster-card span { font-size: 10px; color: #666; display: block; margin-top: 2px; }

        .slots-container { display: flex; justify-content: space-between; gap: 10px; margin-top: 10px; background: rgba(0,0,0,0.05); padding: 10px; border-radius: 8px; }
        .team-slot-group { width: 48%; }
        .team-slot-group h3 { font-size: 12px; margin-bottom: 6px; text-align: center; }
        .slots-list { display: flex; gap: 4px; justify-content: center; }
        .slot-box { width: 30%; height: 40px; border: 2px dashed #8b5a2b; border-radius: 4px; display: flex; align-items: center; justify-content: center; font-size: 10px; font-weight: bold; background: #fff; text-align: center; }

        .btn-start { background: #4caf50; color: #fff; border: 2px solid #2e7d32; padding: 10px; font-size: 14px; font-weight: bold; border-radius: 6px; cursor: pointer; text-align: center; margin-top: 5px; }
        .btn-start:disabled { background: #ccc; border-color: #999; cursor: not-allowed; }

        /* TELA DE JOGO */
        #game-screen { display: none; }

        .field { display: flex; justify-content: space-between; background: rgba(0,0,0,0.05); border: 2px dashed #8b5a2b; border-radius: 8px; padding: 10px; height: 230px; position: relative; }
        .team-side { width: 48%; height: 100%; position: relative; }
        
        .ally-side .pos-back-top { position: absolute; left: 5%; top: 5%; }
        .ally-side .pos-front { position: absolute; left: 55%; top: 35%; }
        .ally-side .pos-back-bottom { position: absolute; left: 5%; bottom: 5%; }

        .enemy-side .pos-back-top { position: absolute; right: 5%; top: 5%; }
        .enemy-side .pos-front { position: absolute; right: 55%; top: 35%; }
        .enemy-side .pos-back-bottom { position: absolute; right: 5%; bottom: 5%; }

        .unit-card {
            width: 95px; background: #fff8dc; border: 2px solid #5c4033; border-radius: 6px; padding: 5px; text-align: center;
            font-size: 10px; cursor: pointer; transition: transform 0.2s, box-shadow 0.2s; position: relative;
        }
        .unit-card.selected-target { border: 3px solid #d32f2f; box-shadow: 0 0 10px #d32f2f; transform: scale(1.08); }
        .unit-card.selected-attacker { border: 3px solid #f1c40f; box-shadow: 0 0 10px #f1c40f; transform: scale(1.08); }
        .unit-card.target-buff-mode { border: 3px solid #2196f3; box-shadow: 0 0 10px #2196f3; transform: scale(1.08); }
        .unit-card.dead { opacity: 0.3; filter: grayscale(100%); cursor: not-allowed; }

        .target-cursor {
            position: absolute; top: -18px; left: 50%; transform: translateX(-50%);
            color: #d32f2f; font-size: 14px; font-weight: bold; display: none; animation: bounce 0.5s infinite alternate;
        }
        .selected-target .target-cursor { display: block; }

        @keyframes bounce { from { top: -18px; } to { top: -24px; } }

        .bar-bg { width: 100%; background: #ddd; height: 7px; border: 1px solid #000; border-radius: 2px; margin-top: 2px; overflow: hidden; }
        .fill-hp { height: 100%; background: #4caf50; width: 100%; transition: width 0.3s; }
        .fill-limit { height: 100%; background: #ffca28; width: 0%; transition: width 0.3s; }

        .status-badge {
            font-size: 8px; font-weight: bold; margin-top: 3px; min-height: 12px;
            color: #c62828; text-shadow: 0px 0px 2px rgba(255,255,255,0.9); word-wrap: break-word;
        }

        #turn-indicator { text-align: center; font-weight: bold; font-size: 14px; color: #5c4033; }
        #log-box { background: #fff; border: 2px solid #5c4033; height: 85px; padding: 6px; font-size: 11px; overflow-y: auto; border-radius: 4px; }
        
        .action-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
        button { background: #fff8dc; border: 2px solid #5c4033; padding: 8px 4px; font-weight: bold; font-size: 10px; cursor: pointer; border-radius: 4px; }
        button:disabled { opacity: 0.5; background: #ccc; cursor: not-allowed; }
        #btn-limit { grid-column: span 2; background: #ffecb3; border-color: #b78103; color: #8c5b00; }
        #btn-limit.ready { background: #ff9800; color: #fff; }
    </style>
</head>
<body>

<!-- TELA DE SELEÇÃO -->
<div id="select-screen" class="screen">
    <div class="select-header">
        <h2>SELEÇÃO DE EQUIPES</h2>
        <p id="select-instruction">Escolha 3 personagens para o <b>SEU TIME</b></p>
    </div>

    <div class="roster-grid" id="roster-container"></div>

    <div class="slots-container">
        <div class="team-slot-group">
            <h3 style="color: #1976d2;">SEU TIME</h3>
            <div class="slots-list">
                <div id="slot-p0" class="slot-box">1º</div>
                <div id="slot-p1" class="slot-box">2º</div>
                <div id="slot-p2" class="slot-box">3º</div>
            </div>
        </div>
        <div class="team-slot-group">
            <h3 style="color: #d32f2f;">TIME INIMIGO</h3>
            <div class="slots-list">
                <div id="slot-e0" class="slot-box">1º</div>
                <div id="slot-e1" class="slot-box">2º</div>
                <div id="slot-e2" class="slot-box">3º</div>
            </div>
        </div>
    </div>

    <button id="btn-start-game" class="btn-start" disabled onclick="iniciarCombate()">INICIAR BATALHA ⚔️</button>
</div>

<!-- TELA DE JOGO -->
<div id="game-screen" class="screen">
    <div id="turn-indicator">SEU TURNO</div>

    <div class="field">
        <!-- Time Aliado -->
        <div class="team-side ally-side">
            <div id="unit-p0" class="unit-card pos-back-top" onclick="cliqueCardAliado('p0')">
                <div id="name-p0">-</div>
                <div class="bar-bg"><div id="hp-p0" class="fill-hp"></div></div>
                <div class="bar-bg"><div id="limit-p0" class="fill-limit"></div></div>
                <div id="status-p0" class="status-badge"></div>
            </div>
            <div id="unit-p1" class="unit-card pos-front" onclick="cliqueCardAliado('p1')">
                <div id="name-p1">-</div>
                <div class="bar-bg"><div id="hp-p1" class="fill-hp"></div></div>
                <div class="bar-bg"><div id="limit-p1" class="fill-limit"></div></div>
                <div id="status-p1" class="status-badge"></div>
            </div>
            <div id="unit-p2" class="unit-card pos-back-bottom" onclick="cliqueCardAliado('p2')">
                <div id="name-p2">-</div>
                <div class="bar-bg"><div id="hp-p2" class="fill-hp"></div></div>
                <div class="bar-bg"><div id="limit-p2" class="fill-limit"></div></div>
                <div id="status-p2" class="status-badge"></div>
            </div>
        </div>

        <!-- Time Inimigo -->
        <div class="team-side enemy-side">
            <div id="unit-e0" class="unit-card pos-back-top" onclick="selecionarAlvoInimigo('e0')">
                <div class="target-cursor">▼ ALVO</div>
                <div id="name-e0">-</div>
                <div class="bar-bg"><div id="hp-e0" class="fill-hp"></div></div>
                <div class="bar-bg"><div id="limit-e0" class="fill-limit"></div></div>
                <div id="status-e0" class="status-badge"></div>
            </div>
            <div id="unit-e1" class="unit-card pos-front" onclick="selecionarAlvoInimigo('e1')">
                <div class="target-cursor">▼ ALVO</div>
                <div id="name-e1">-</div>
                <div class="bar-bg"><div id="hp-e1" class="fill-hp"></div></div>
                <div class="bar-bg"><div id="limit-e1" class="fill-limit"></div></div>
                <div id="status-e1" class="status-badge"></div>
            </div>
            <div id="unit-e2" class="unit-card pos-back-bottom" onclick="selecionarAlvoInimigo('e2')">
                <div class="target-cursor">▼ ALVO</div>
                <div id="name-e2">-</div>
                <div class="bar-bg"><div id="hp-e2" class="fill-hp"></div></div>
                <div class="bar-bg"><div id="limit-e2" class="fill-limit"></div></div>
                <div id="status-e2" class="status-badge"></div>
            </div>
        </div>
    </div>

    <div id="log-box">> Sistema de Batalha Inicializado. Escolha sua ação!</div>

    <div class="action-grid">
        <button id="btn-atq1" onclick="executarAcaoJogador(0)">Habilidade 1</button>
        <button id="btn-atq2" onclick="executarAcaoJogador(1)">Habilidade 2</button>
        <button id="btn-atq3" onclick="executarAcaoJogador(2)">Habilidade 3</button>
        <button id="btn-atq4" onclick="executarAcaoJogador(3)">Habilidade 4</button>
        <button id="btn-limit" disabled onclick="executarAcaoJogador('limit')">QUEBRA DE LIMITES (0%)</button>
    </div>
</div>

<script>
    const BANCO_DE_DADOS_PERSONAGENS = {
        "Ysma": {
            hpMax: 100, danoFisico: 15, elementoBase: "Mágico", fraqueza: "Purificação", imunidade: "Fogo",
            habilidades: [
                { nome: "Acerto Perfurante", dano: 15, elemento: "Físico", cdMax: 0, cdAtual: 0, tipo: "ataque" },
                { nome: "Bola de Fogo", dano: 35, elemento: "Fogo", cdMax: 2, cdAtual: 0, tipo: "ataque", efeito: "queimadura", chanceEfeito: 100 },
                { nome: "Raio de Gelo", dano: 10, elemento: "Gelo", cdMax: 4, cdAtual: 0, tipo: "ataque", efeito: "congelamento", chanceEfeito: 40 },
                { nome: "Furacão", dano: 25, elemento: "Vento", cdMax: 4, cdAtual: 0, tipo: "ataque", efeito: "leve" }
            ],
            limitBreak: { nome: "Explosão Prisma", dano: 50, elemento: "Mágico", tipo: "limit_padrao" }
        },
        "Campos": {
            hpMax: 200, danoFisico: 20, elementoBase: "Corrupção", fraqueza: "Nenhuma", imunidade: "Nenhuma",
            habilidades: [
                { nome: "Garras Vorazes", dano: 20, elemento: "Físico", cdMax: 0, cdAtual: 0, tipo: "ataque" },
                { nome: "Surto Corrupto", dano: 40, elemento: "Corrupção", cdMax: 3, cdAtual: 0, tipo: "ataque" },
                { nome: "Simbiose", dano: 0, elemento: "Suporte", cdMax: 4, cdAtual: 0, tipo: "buff_aliado" },
                { nome: "Laceração", dano: 20, elemento: "Corrupção", cdMax: 3, cdAtual: 0, tipo: "ataque", efeito: "sangramento" }
            ],
            limitBreak: { nome: "Banquete Simbiótico", dano: 60, elemento: "Corrupção", tipo: "limit_banquete" }
        },
        "Dunnie": {
            hpMax: 100, danoFisico: 20, elementoBase: "Físico", fraqueza: "Biológico", imunidade: "Purificação",
            habilidades: [
                { nome: "Acerto Perfurante", dano: 20, elemento: "Físico", cdMax: 0, cdAtual: 0, tipo: "ataque" },
                { nome: "Preparo", dano: 0, elemento: "Físico", cdMax: 2, cdAtual: 0, tipo: "buff_proprio" },
                { nome: "Ataque Rápido", dano: 30, elemento: "Físico", cdMax: 2, cdAtual: 0, tipo: "ataque" },
                { nome: "Exílio dos Antigos", dano: 25, elemento: "Biológico", cdMax: 5, cdAtual: 0, tipo: "ataque", efeito: "veneno", chanceEfeito: 100 }
            ],
            limitBreak: { nome: "Força dos Antigos", dano: 50, elemento: "Biológico", tipo: "limit_aoe", efeito: "veneno", chanceEfeito: 100 }
        },
        "Doctor": {
            hpMax: 110, danoFisico: 10, elementoBase: "Biológico", fraqueza: "Fogo", imunidade: "Nenhuma",
            habilidades: [
                { nome: "Bisturi Certeiro", dano: 18, elemento: "Físico", cdMax: 0, cdAtual: 0, tipo: "ataque" },
                { nome: "Toxina Concentrada", dano: 20, elemento: "Biológico", cdMax: 3, cdAtual: 0, tipo: "ataque", efeito: "veneno" },
                { nome: "Cálculo Tático", dano: 0, elemento: "Suporte", cdMax: 2, cdAtual: 0, tipo: "buff_proprio" },
                { nome: "Pulso Anestésico", dano: 15, elemento: "Biológico", cdMax: 4, cdAtual: 0, tipo: "ataque", efeito: "congelamento" }
            ],
            limitBreak: { nome: "Operação Crítica", dano: 55, elemento: "Biológico", tipo: "limit_padrao" }
        },
        "Night": {
            hpMax: 120, danoFisico: 25, elementoBase: "Escuridão", fraqueza: "Luz", imunidade: "Vento",
            habilidades: [
                { nome: "Ataque Sombrio", dano: 22, elemento: "Físico", cdMax: 0, cdAtual: 0, tipo: "ataque" },
                { nome: "Lâmina Sombria", dano: 35, elemento: "Escuridão", cdMax: 2, cdAtual: 0, tipo: "ataque", efeito: "sangramento" },
                { nome: "Passo nas Sombras", dano: 0, elemento: "Vento", cdMax: 3, cdAtual: 0, tipo: "buff_proprio" },
                { nome: "Golpe Voador", dano: 30, elemento: "Vento", cdMax: 3, cdAtual: 0, tipo: "ataque" }
            ],
            limitBreak: { nome: "Eclipsar", dano: 65, elemento: "Escuridão", tipo: "limit_padrao" }
        },
        "Mika": {
            hpMax: 90, danoFisico: 12, elementoBase: "Fogo", fraqueza: "Gelo", imunidade: "Vento",
            habilidades: [
                { nome: "Faísca Quick", dano: 15, elemento: "Fogo", cdMax: 0, cdAtual: 0, tipo: "ataque" },
                { nome: "Onda de Calor", dano: 30, elemento: "Fogo", cdMax: 2, cdAtual: 0, tipo: "ataque", efeito: "queimadura" },
                { nome: "Vendaval Flamejante", dano: 28, elemento: "Vento", cdMax: 3, cdAtual: 0, tipo: "ataque", efeito: "leve" },
                { nome: "Capa Protetora", dano: 0, elemento: "Suporte", cdMax: 3, cdAtual: 0, tipo: "buff_proprio" }
            ],
            limitBreak: { nome: "Supernova Mika", dano: 55, elemento: "Fogo", tipo: "limit_aoe", efeito: "queimadura" }
        }
    };

    // Variaveis de seleção de personagens
    let timeAliadoSelecionado = [];
    let timeInimigoSelecionado = [];
    let faseSelecao = "aliado"; // "aliado" ou "inimigo"

    let unidades = {};
    let atacanteAtualId = 'p1'; 
    let alvoInimigoId = 'e1';   
    let emTurnoInimigo = false;
    let modoSelecaoSimbiose = false; 

    function renderizarRoster() {
        let container = document.getElementById('roster-container');
        container.innerHTML = '';
        
        for (let nome in BANCO_DE_DADOS_PERSONAGENS) {
            let p = BANCO_DE_DADOS_PERSONAGENS[nome];
            let card = document.createElement('div');
            card.className = 'roster-card';
            
            if (timeAliadoSelecionado.includes(nome)) card.classList.add('selected-ally');
            if (timeInimigoSelecionado.includes(nome)) card.classList.add('selected-enemy');

            card.innerHTML = `
                <h4>${nome}</h4>
                <span>HP: ${p.hpMax} | Elem: ${p.elementoBase}</span>
            `;
            card.onclick = () => selecionarPersonagemRoster(nome);
            container.appendChild(card);
        }
    }

    function selecionarPersonagemRoster(nome) {
        if (faseSelecao === "aliado") {
            if (timeAliadoSelecionado.includes(nome)) {
                timeAliadoSelecionado = timeAliadoSelecionado.filter(n => n !== nome);
            } else if (timeAliadoSelecionado.length < 3) {
                timeAliadoSelecionado.push(nome);
            }

            if (timeAliadoSelecionado.length === 3) {
                faseSelecao = "inimigo";
                document.getElementById('select-instruction').innerHTML = "Agora escolha 3 personagens para o <b>TIME INIMIGO</b>";
            }
        } else if (faseSelecao === "inimigo") {
            if (timeInimigoSelecionado.includes(nome)) {
                timeInimigoSelecionado = timeInimigoSelecionado.filter(n => n !== nome);
            } else if (timeInimigoSelecionado.length < 3) {
                timeInimigoSelecionado.push(nome);
            }
        }
        atualizarPainelSlots();
        renderizarRoster();
    }

    function atualizarPainelSlots() {
        for (let i = 0; i < 3; i++) {
            let slotP = document.getElementById(`slot-p${i}`);
            let slotE = document.getElementById(`slot-e${i}`);

            slotP.innerText = timeAliadoSelecionado[i] || `${i+1}º`;
            slotE.innerText = timeInimigoSelecionado[i] || `${i+1}º`;
        }

        let btnStart = document.getElementById('btn-start-game');
        btnStart.disabled = !(timeAliadoSelecionado.length === 3 && timeInimigoSelecionado.length === 3);
    }

    function criarInstancia(nomeModelo, id) {
        let base = BANCO_DE_DADOS_PERSONAGENS[nomeModelo];
        return {
            id: id, nome: nomeModelo, hpMax: base.hpMax, hpAtual: base.hpMax,
            danoFisico: base.danoFisico, fraqueza: base.fraqueza, imunidade: base.imunidade,
            limite: 0, habilidades: JSON.parse(JSON.stringify(base.habilidades)),
            limitBreak: JSON.parse(JSON.stringify(base.limitBreak)),
            escudoSimbiose: 0, escudoDunnie: 0, sangramento: 0, queimadura: 0, veneno: 0, congelado: false, leve: 0
        };
    }

    function iniciarCombate() {
        unidades = {
            'p0': criarInstancia(timeAliadoSelecionado[0], "p0"),
            'p1': criarInstancia(timeAliadoSelecionado[1], "p1"),
            'p2': criarInstancia(timeAliadoSelecionado[2], "p2"),
            'e0': criarInstancia(timeInimigoSelecionado[0], "e0"),
            'e1': criarInstancia(timeInimigoSelecionado[1], "e1"),
            'e2': criarInstancia(timeInimigoSelecionado[2], "e2")
        };

        document.getElementById('select-screen').style.display = 'none';
        document.getElementById('game-screen').style.display = 'flex';

        atacanteAtualId = 'p1';
        alvoInimigoId = 'e1';
        atualizarUI();
    }

    function cliqueCardAliado(id) {
        if (emTurnoInimigo || unidades[id].hpAtual <= 0) return;
        if (modoSelecaoSimbiose) {
            aplicarSimbioseNoAliado(id);
            return;
        }
        atacanteAtualId = id;
        atualizarUI();
    }

    function selecionarAlvoInimigo(id) {
        if (emTurnoInimigo || unidades[id].hpAtual <= 0 || modoSelecaoSimbiose) return;
        alvoInimigoId = id;
        atualizarUI();
    }

    function calcularDano(atacante, defensor, habilidade) {
        if (habilidade.elemento === defensor.imunidade) {
            log(`<b style="color:blue;">IMUNE!</b> ${defensor.nome} não recebeu dano.`);
            return 0;
        }

        let danoBase = habilidade.dano;

        if (habilidade.elemento === "Vento" && defensor.leve > 0) {
            danoBase += 20;
            log(`💨 <b>BÔNUS LEVE!</b> (+20 Dano em ${defensor.nome})`);
        }

        if (habilidade.elemento === defensor.fraqueza) {
            danoBase += 30;
            log(`<b style="color:red;">FRAQUEZA! (+30 Dano em ${defensor.nome})</b>`);
        }

        if (defensor.escudoDunnie > 0 && danoBase > 0) {
            danoBase = Math.max(0, danoBase - 30);
            defensor.escudoDunnie = 0; 
            log(`🛡️ <b>Preparo</b> reduziu o dano em 30 em <b>${defensor.nome}</b>!`);
        }

        if (defensor.escudoSimbiose > 0 && danoBase > 0) {
            danoBase = Math.max(0, danoBase - 20);
            log(`🛡️ <b>Simbiose</b> reduziu o dano em 20 em <b>${defensor.nome}</b>!`);
        }

        return danoBase;
    }

    function carregarLimite(unidade, qtd) {
        unidade.limite = Math.min(100, unidade.limite + qtd);
    }

    function aplicarDanoPosAtaque(unidade) {
        if (unidade.hpAtual > 0 && unidade.queimadura > 0) {
            unidade.hpAtual = Math.max(0, unidade.hpAtual - 10);
            log(`🔥 <b>${unidade.nome}</b> sofreu 10 de dano por Queimadura!`);
        }
    }

    function executarAcaoJogador(indiceHab) {
        if (emTurnoInimigo || modoSelecaoSimbiose) return;

        let atacante = unidades[atacanteAtualId];
        let defensor = unidades[alvoInimigoId];

        if (atacante.hpAtual <= 0) return;

        if (atacante.congelado) {
            log(`❄ <b>${atacante.nome}</b> está congelado e perdeu a vez!`);
            atacante.congelado = false; 
            iniciarTurnoInimigo();
            return;
        }

        let habilidade = (indiceHab === 'limit') ? atacante.limitBreak : atacante.habilidades[indiceHab];

        if (habilidade.tipo === 'buff_aliado') {
            modoSelecaoSimbiose = true;
            log("🔵 <b>Simbiose:</b> Clique em um card aliado para dar o escudo!");
            atualizarUI();
            return;
        }

        if (habilidade.tipo === 'buff_proprio') {
            atacante.hpAtual = Math.min(atacante.hpMax, atacante.hpAtual + 30);
            atacante.escudoDunnie = 1;
            carregarLimite(atacante, 15);
            if (indiceHab !== 'limit') habilidade.cdAtual = habilidade.cdMax;
            log(`🛡️ <b>${atacante.nome}</b> usou habilidade de defesa/suporte!`);
            
            aplicarDanoPosAtaque(atacante);
            if (verificarVitoria()) return;
            iniciarTurnoInimigo();
            return;
        }

        if (!defensor || defensor.hpAtual <= 0) return;

        if (habilidade.tipo === 'limit_banquete') {
            let dano = calcularDano(atacante, defensor, habilidade);
            defensor.hpAtual = Math.max(0, defensor.hpAtual - dano);
            atacante.limite = 0;
            let cura = Math.round(dano * 0.30);
            log(`🔥 <b>${atacante.nome}</b> usou Banquete Simbiótico causando ${dano} de dano!`);
            ['p0', 'p1', 'p2'].forEach(pId => {
                if (unidades[pId].hpAtual > 0) unidades[pId].hpAtual = Math.min(unidades[pId].hpMax, unidades[pId].hpAtual + cura);
            });
        } else if (habilidade.tipo === 'limit_aoe') {
            atacante.limite = 0;
            log(`⚡ <b>${atacante.nome}</b> usou ${habilidade.nome}!`);
            ['e0', 'e1', 'e2'].forEach(eId => {
                let inimigo = unidades[eId];
                if (inimigo.hpAtual > 0) {
                    let dano = calcularDano(atacante, inimigo, habilidade);
                    inimigo.hpAtual = Math.max(0, inimigo.hpAtual - dano);
                    if (habilidade.efeito === 'veneno') inimigo.veneno = 6;
                    if (habilidade.efeito === 'queimadura') inimigo.queimadura = 3;
                }
            });
        } else {
            let dano = calcularDano(atacante, defensor, habilidade);
            defensor.hpAtual = Math.max(0, defensor.hpAtual - dano);

            if (indiceHab === 'limit') {
                atacante.limite = 0;
            } else {
                carregarLimite(atacante, 25);
                carregarLimite(defensor, 15);
                if (habilidade.cdMax > 0) habilidade.cdAtual = habilidade.cdMax;
            }

            log(`<b>${atacante.nome}</b> usou <b>${habilidade.nome}</b> em <b>${defensor.nome}</b> causando ${dano} de dano!`);

            if (habilidade.efeito === 'sangramento') defensor.sangramento = 3;
            else if (habilidade.efeito === 'veneno') defensor.veneno = 6;
            else if (habilidade.efeito === 'queimadura') defensor.queimadura = 2;
            else if (habilidade.efeito === 'congelamento') defensor.congelado = true;
            else if (habilidade.efeito === 'leve') defensor.leve = 2;
        }

        aplicarDanoPosAtaque(atacante);
        if (verificarVitoria()) return;
        iniciarTurnoInimigo();
    }

    function aplicarSimbioseNoAliado(aliadoId) {
        let atacante = unidades[atacanteAtualId];
        let aliadoTarget = unidades[aliadoId];
        let hab = atacante.habilidades[2];

        aliadoTarget.escudoSimbiose = 2;
        hab.cdAtual = hab.cdMax;
        carregarLimite(atacante, 15);

        log(`🛡 <b>${atacante.nome}</b> aplicou Simbiose em <b>${aliadoTarget.nome}</b>!`);
        modoSelecaoSimbiose = false;
        
        aplicarDanoPosAtaque(atacante);
        if (verificarVitoria()) return;
        iniciarTurnoInimigo();
    }

    function processarEfeitosStatus() {
        for (let id in unidades) {
            let u = unidades[id];
            if (u.hpAtual <= 0) continue;

            if (u.sangramento > 0) {
                u.hpAtual = Math.max(0, u.hpAtual - 10);
                u.sangramento--;
                log(`🩸 <b>${u.nome}</b> sofreu 10 de dano por Sangramento!`);
            }

            if (u.veneno > 0) {
                u.hpAtual = Math.max(0, u.hpAtual - 10);
                u.veneno--;
                log(`🧪 <b>${u.nome}</b> sofreu 10 de dano por Veneno!`);
            }

            if (u.queimadura > 0) u.queimadura--;
            if (u.leve > 0) u.leve--;
            if (u.escudoSimbiose > 0) u.escudoSimbiose--;
        }
    }

    function log(m) {
        let b = document.getElementById('log-box');
        b.innerHTML += `<div>> ${m}</div>`;
        b.scrollTop = b.scrollHeight;
    }

    function verificarVitoria() {
        let inimigosMortos = ['e0', 'e1', 'e2'].every(id => unidades[id].hpAtual <= 0);
        if (inimigosMortos) {
            log("🎉 <b>VITÓRIA!</b> Todos os inimigos foram derrotados!");
            return true;
        }
        return false;
    }

    function verificarDerrota() {
        let aliadosMortos = ['p0', 'p1', 'p2'].every(id => unidades[id].hpAtual <= 0);
        if (aliadosMortos) {
            log("💀 <b>DERROTA!</b> Seu time foi derrotado!");
            return true;
        }
        return false;
    }

    function atualizarUI() {
        for (let id in unidades) {
            let u = unidades[id];
            let card = document.getElementById(`unit-${id}`);
            let hpBar = document.getElementById(`hp-${id}`);
            let limitBar = document.getElementById(`limit-${id}`);
            let statusBadge = document.getElementById(`status-${id}`);

            document.getElementById(`name-${id}`).innerText = u.nome + (id.startsWith('e') ? " (Inimigo)" : "");
            hpBar.style.width = Math.max(0, (u.hpAtual / u.hpMax) * 100) + "%";
            limitBar.style.width = u.limite + "%";

            if (statusBadge) {
                let listaStatus = [];
                if (u.congelado) listaStatus.push("❄️ CONGELADO");
                if (u.queimadura > 0) listaStatus.push(`🔥 QUEIMADO (${u.queimadura}t)`);
                if (u.veneno > 0) listaStatus.push(`🧪 VENENO (${u.veneno}t)`);
                if (u.sangramento > 0) listaStatus.push(`🩸 SANGRANDO (${u.sangramento}t)`);
                if (u.leve > 0) listaStatus.push(`🍃 LEVE (${u.leve}t)`);
                if (u.escudoSimbiose > 0) listaStatus.push(`🛡️ SIMBIOSE (${u.escudoSimbiose}t)`);
                if (u.escudoDunnie > 0) listaStatus.push(`🛡️ PREPARO`);

                statusBadge.innerHTML = listaStatus.join("<br>");
            }

            if (u.hpAtual <= 0) card.classList.add('dead');
            else card.classList.remove('dead');

            card.classList.remove('selected-attacker', 'selected-target', 'target-buff-mode');

            if (modoSelecaoSimbiose && id.startsWith('p')) {
                card.classList.add('target-buff-mode');
            } else {
                if (id === atacanteAtualId) card.classList.add('selected-attacker');
                if (id === alvoInimigoId) card.classList.add('selected-target');
            }
        }

        let at = unidades[atacanteAtualId];
        if (at && at.hpAtual > 0) {
            for (let i = 0; i < 4; i++) {
                let btn = document.getElementById(`btn-atq${i + 1}`);
                let h = at.habilidades[i];
                if (h) {
                    btn.innerText = `${h.nome} ${h.cdAtual > 0 ? `(${h.cdAtual}t)` : ''}`;
                    btn.disabled = h.cdAtual > 0 || emTurnoInimigo;
                }
            }
            let btnL = document.getElementById('btn-limit');
            btnL.innerText = `QUEBRA DE LIMITES (${at.limite}%)`;
            btnL.disabled = at.limite < 100 || emTurnoInimigo;
            if (at.limite >= 100) btnL.classList.add('ready');
            else btnL.classList.remove('ready');
        }
    }

    function iniciarTurnoInimigo() {
        emTurnoInimigo = true;
        let turnInd = document.getElementById('turn-indicator');
        turnInd.innerText = 'TURNO INIMIGO...';
        turnInd.style.color = 'red';
        
        ['p0', 'p1', 'p2'].forEach(pId => {
            unidades[pId].habilidades.forEach(h => { if (h.cdAtual > 0) h.cdAtual--; });
        });

        processarEfeitosStatus();
        atualizarUI();

        if (verificarVitoria() || verificarDerrota()) return;

        setTimeout(() => {
            let inimigosVivos = ['e0', 'e1', 'e2'].filter(id => unidades[id].hpAtual > 0);
            let aliadosVivos = ['p0', 'p1', 'p2'].filter(id => unidades[id].hpAtual > 0);

            if (inimigosVivos.length > 0 && aliadosVivos.length > 0) {
                let idInimigo = inimigosVivos[Math.floor(Math.random() * inimigosVivos.length)];
                let atacanteInimigo = unidades[idInimigo];

                atacanteInimigo.habilidades.forEach(h => { if(h.cdAtual > 0) h.cdAtual--; });

                if (atacanteInimigo.congelado) {
                    log(`❄ <b>${atacanteInimigo.nome} (Inimigo)</b> está CONGELADO e perdeu a vez!`);
                    atacanteInimigo.congelado = false;
                } else {
                    let alvoAliadoId = aliadosVivos[Math.floor(Math.random() * aliadosVivos.length)];
                    let alvoAliado = unidades[alvoAliadoId];

                    let habsDisponiveis = atacanteInimigo.habilidades.filter(h => h.cdAtual === 0 && h.tipo !== 'buff_aliado');
                    let habUsada = habsDisponiveis.length > 0 ? habsDisponiveis[Math.floor(Math.random() * habsDisponiveis.length)] : atacanteInimigo.habilidades[0];

                    if (habUsada.tipo === 'buff_proprio') {
                        atacanteInimigo.hpAtual = Math.min(atacanteInimigo.hpMax, atacanteInimigo.hpAtual + 30);
                        atacanteInimigo.escudoDunnie = 1;
                        carregarLimite(atacanteInimigo, 15);
                        habUsada.cdAtual = habUsada.cdMax;
                        log(`🛡️ <b>${atacanteInimigo.nome} (Inimigo)</b> usou habilidade de defesa!`);
                    } else {
                        let dano = calcularDano(atacanteInimigo, alvoAliado, habUsada);
                        alvoAliado.hpAtual = Math.max(0, alvoAliado.hpAtual - dano);
                        carregarLimite(atacanteInimigo, 25);
                        carregarLimite(alvoAliado, 15);
                        if (habUsada.cdMax > 0) habUsada.cdAtual = habUsada.cdMax;
                        log(`⚔️ <b>${atacanteInimigo.nome} (Inimigo)</b> usou <b>${habUsada.nome}</b> causando ${dano} de dano!`);

                        if (habUsada.efeito === 'veneno') alvoAliado.veneno = 6;
                        if (habUsada.efeito === 'queimadura') alvoAliado.queimadura = 2;
                    }
                }
                aplicarDanoPosAtaque(atacanteInimigo);
            }

            emTurnoInimigo = false;
            turnInd.innerText = 'SEU TURNO';
            turnInd.style.color = '#5c4033';
            
            atualizarUI();
            verificarDerrota();
        }, 800);
    }

    // Inicializar roster na tela de seleção ao carregar
    renderizarRoster();
</script>
