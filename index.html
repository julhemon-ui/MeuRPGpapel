<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3v3 Paper RPG - Ysma & Campos</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        body { background: #1a1a1a; font-family: 'Courier New', Courier, monospace; color: #333; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        
        #game-container {
            width: 100%; max-width: 650px; background: #f4ecd8;
            background-image: linear-gradient(#ccc 0.05em, transparent 0.05em), linear-gradient(90deg, #ccc 0.05em, transparent 0.05em);
            background-size: 20px 20px; border: 5px solid #5c4033; border-radius: 12px; padding: 12px; display: flex; flex-direction: column; gap: 10px;
        }

        /* Arena PvP em Triângulo */
        .field { display: flex; justify-content: space-between; background: rgba(0,0,0,0.05); border: 2px dashed #8b5a2b; border-radius: 8px; padding: 10px; height: 210px; position: relative; }
        .team-side { width: 48%; height: 100%; position: relative; }
        
        /* Posições */
        .ally-side .pos-back-top { position: absolute; left: 5%; top: 5%; }
        .ally-side .pos-front { position: absolute; left: 55%; top: 35%; }
        .ally-side .pos-back-bottom { position: absolute; left: 5%; bottom: 5%; }

        .enemy-side .pos-back-top { position: absolute; right: 5%; top: 5%; }
        .enemy-side .pos-front { position: absolute; right: 55%; top: 35%; }
        .enemy-side .pos-back-bottom { position: absolute; right: 5%; bottom: 5%; }

        /* Card de Unidade estilo Paper Cutout */
        .unit-card {
            width: 85px; background: #fff8dc; border: 2px solid #5c4033; border-radius: 6px; padding: 5px; text-align: center;
            font-size: 10px; cursor: pointer; transition: transform 0.2s, box-shadow 0.2s; position: relative;
        }
        
        /* Destaques Visuais */
        .unit-card.selected-target { border: 3px solid #d32f2f; box-shadow: 0 0 10px #d32f2f; transform: scale(1.08); }
        .unit-card.active-attacker { border: 3px solid #f39c12; box-shadow: 0 0 12px #f1c40f; transform: scale(1.08); background: #fffdf0; }
        .unit-card.dead { opacity: 0.3; filter: grayscale(100%); cursor: not-allowed; }
        .unit-card.shielded { border-color: #27ae60; background: #e8f8f5; }

        /* Cursores Indicadores */
        .target-cursor, .attacker-cursor {
            position: absolute; top: -18px; left: 50%; transform: translateX(-50%);
            font-size: 11px; font-weight: bold; display: none; animation: bounce 0.5s infinite alternate;
        }
        .target-cursor { color: #d32f2f; }
        .attacker-cursor { color: #d35400; }

        .selected-target .target-cursor { display: block; }
        .active-attacker .attacker-cursor { display: block; }

        @keyframes bounce { from { top: -18px; } to { top: -24px; } }

        /* Barras de Status */
        .bar-bg { width: 100%; background: #ddd; height: 8px; border: 1px solid #000; border-radius: 2px; margin-top: 2px; overflow: hidden; }
        .fill-hp { height: 100%; background: #4caf50; width: 100%; transition: width 0.3s; }
        .fill-limit { height: 100%; background: #ffca28; width: 0%; transition: width 0.3s; }

        #status-header { text-align: center; font-weight: bold; font-size: 14px; color: #5c4033; }
        #log-box { background: #fff; border: 2px solid #5c4033; height: 80px; padding: 6px; font-size: 11px; overflow-y: auto; border-radius: 4px; }
        
        /* Seletor de Aliado Ativo */
        .attacker-selector { display: flex; justify-content: space-around; background: #e8dcc4; padding: 4px; border-radius: 4px; border: 1px solid #8b5a2b; }
        .attacker-selector label { font-size: 11px; font-weight: bold; cursor: pointer; }

        .action-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
        button { background: #fff8dc; border: 2px solid #5c4033; padding: 8px 4px; font-weight: bold; font-size: 10px; cursor: pointer; border-radius: 4px; }
        button:disabled { opacity: 0.5; background: #ccc; cursor: not-allowed; }
        #btn-limit { grid-column: span 2; background: #ffecb3; border-color: #b78103; color: #8c5b00; }
        #btn-limit.ready { background: #ff9800; color: #fff; }
    </style>
</head>
<body>

<div id="game-container">
    <div id="status-header">SEU TURNO - ESCOLHA O ATACANTE</div>

    <!-- Arena 3v3 -->
    <div class="field">
        <!-- Time do Jogador -->
        <div class="team-side ally-side">
            <div id="unit-p0" class="unit-card pos-back-top" onclick="selecionarAtacante('p0')">
                <div class="attacker-cursor">★ TURNO</div>
                <div id="name-p0">Ysma</div>
                <div class="bar-bg"><div id="hp-p0" class="fill-hp"></div></div>
                <div class="bar-bg"><div id="limit-p0" class="fill-limit"></div></div>
            </div>
            <div id="unit-p1" class="unit-card pos-front" onclick="selecionarAtacante('p1')">
                <div class="attacker-cursor">★ TURNO</div>
                <div id="name-p1">Campos</div>
                <div class="bar-bg"><div id="hp-p1" class="fill-hp"></div></div>
                <div class="bar-bg"><div id="limit-p1" class="fill-limit"></div></div>
            </div>
            <div id="unit-p2" class="unit-card pos-back-bottom" onclick="selecionarAtacante('p2')">
                <div class="attacker-cursor">★ TURNO</div>
                <div id="name-p2">Ysma 2</div>
                <div class="bar-bg"><div id="hp-p2" class="fill-hp"></div></div>
                <div class="bar-bg"><div id="limit-p2" class="fill-limit"></div></div>
            </div>
        </div>

        <!-- Time Inimigo -->
        <div class="team-side enemy-side">
            <div id="unit-e0" class="unit-card pos-back-top" onclick="selecionarAlvoInimigo('e0')">
                <div class="target-cursor">▼ ALVO</div>
                <div id="name-e0">E1</div>
                <div class="bar-bg"><div id="hp-e0" class="fill-hp"></div></div>
                <div class="bar-bg"><div id="limit-e0" class="fill-limit"></div></div>
            </div>
            <div id="unit-e1" class="unit-card pos-front" onclick="selecionarAlvoInimigo('e1')">
                <div class="target-cursor">▼ ALVO</div>
                <div id="name-e1">E2</div>
                <div class="bar-bg"><div id="hp-e1" class="fill-hp"></div></div>
                <div class="bar-bg"><div id="limit-e1" class="fill-limit"></div></div>
            </div>
            <div id="unit-e2" class="unit-card pos-back-bottom" onclick="selecionarAlvoInimigo('e2')">
                <div class="target-cursor">▼ ALVO</div>
                <div id="name-e2">E3</div>
                <div class="bar-bg"><div id="hp-e2" class="fill-hp"></div></div>
                <div class="bar-bg"><div id="limit-e2" class="fill-limit"></div></div>
            </div>
        </div>
    </div>

    <!-- Barra de Troca Rápida de Atacante -->
    <div class="attacker-selector">
        <span style="font-size: 11px; font-weight: bold;">Atacando com:</span>
        <label><input type="radio" name="atq-select" value="p0" onclick="selecionarAtacante('p0')"> Ysma</label>
        <label><input type="radio" name="atq-select" value="p1" onclick="selecionarAtacante('p1')" checked> Campos</label>
        <label><input type="radio" name="atq-select" value="p2" onclick="selecionarAtacante('p2')"> Ysma 2</label>
    </div>

    <!-- Log de Ações -->
    <div id="log-box">> Selecione quem agirá no turno e escolha a habilidade!</div>

    <!-- Painel de Ações do Personagem Ativo -->
    <div class="action-grid">
        <button id="btn-atq1" onclick="executarAcaoJogador(0)">Atacar</button>
        <button id="btn-atq2" onclick="executarAcaoJogador(1)">Habilidade 1</button>
        <button id="btn-atq3" onclick="executarAcaoJogador(2)">Habilidade 2</button>
        <button id="btn-atq4" onclick="executarAcaoJogador(3)">Habilidade 3</button>
        <button id="btn-limit" disabled onclick="executarAcaoJogador('limit')">QUEBRA DE LIMITES (0%)</button>
    </div>
</div>

<script>
    // BANCO DE DADOS COM YSMA E CAMPOS
    const BANCO_DE_DADOS_PERSONAGENS = {
        "Ysma": {
            hpMax: 90, danoFisico: 15, elementoBase: "Mágico", fraqueza: "Purificação", imunidade: "Fogo",
            habilidades: [
                { nome: "Acerto Perfurante", dano: 15, elemento: "Físico", cdMax: 0, cdAtual: 0, tipo: "dano" },
                { nome: "Bola de Fogo", dano: 45, elemento: "Fogo", cdMax: 2, cdAtual: 0, tipo: "dano" },
                { nome: "Raio de Gelo", dano: 10, elemento: "Gelo", cdMax: 4, cdAtual: 0, tipo: "dano" },
                { nome: "Furacão", dano: 25, elemento: "Vento", cdMax: 4, cdAtual: 0, tipo: "dano" }
            ],
            limitBreak: { nome: "Explosão de Cristal Prisma", dano: 50, elemento: "Mágico", tipo: "area" }
        },
        "Campos": {
            hpMax: 200, danoFisico: 20, elementoBase: "Corrupção", fraqueza: "Purificação", imunidade: "Corrupção",
            habilidades: [
                { nome: "Garras Vorazes", dano: 20, elemento: "Físico", cdMax: 0, cdAtual: 0, tipo: "dano" },
                { nome: "Surto Corrupto", dano: 40, elemento: "Corrupção", cdMax: 3, cdAtual: 0, tipo: "dano" },
                { nome: "Simbiose", dano: 0, elemento: "Suporte", cdMax: 4, cdAtual: 0, tipo: "escudo" },
                { nome: "Laceração", dano: 20, elemento: "Corrupção", cdMax: 3, cdAtual: 0, tipo: "dano" }
            ],
            limitBreak: { nome: "Banquete Simbiótico", dano: 60, elemento: "Corrupção", tipo: "life_steal" }
        },
        "InimigoPadrao": {
            hpMax: 80, danoFisico: 10, fraqueza: "Fogo", imunidade: "Nenhuma",
            habilidades: [
                { nome: "Golpe Purificador", dano: 10, elemento: "Purificação", cdMax: 0, cdAtual: 0, tipo: "dano" }
            ],
            limitBreak: { nome: "Ataque Pesado", dano: 30, elemento: "Físico", tipo: "dano" }
        }
    };

    let unidades = {
        'p0': criarInstancia("Ysma", "p0", "Ysma"),
        'p1': criarInstancia("Campos", "p1", "Campos"),
        'p2': criarInstancia("Ysma", "p2", "Ysma 2"),
        'e0': criarInstancia("InimigoPadrao", "e0", "Inimigo 1"),
        'e1': criarInstancia("InimigoPadrao", "e1", "Inimigo 2"),
        'e2': criarInstancia("InimigoPadrao", "e2", "Inimigo 3")
    };

    let atacanteAtualId = 'p1'; // Campos como Vanguarda padrão
    let alvoInimigoId = 'e1';
    let emTurnoInimigo = false;

    function criarInstancia(nomeModelo, id, apelido) {
        let base = BANCO_DE_DADOS_PERSONAGENS[nomeModelo];
        return {
            id: id, nome: apelido || nomeModelo, modelo: nomeModelo, hpMax: base.hpMax, hpAtual: base.hpMax,
            danoFisico: base.danoFisico, fraqueza: base.fraqueza, imunidade: base.imunidade,
            limite: 0, duracaoEscudo: 0,
            habilidades: JSON.parse(JSON.stringify(base.habilidades)),
            limitBreak: JSON.parse(JSON.stringify(base.limitBreak))
        };
    }

    function selecionarAtacante(id) {
        if (emTurnoInimigo || unidades[id].hpAtual <= 0) return;
        atacanteAtualId = id;
        
        let radios = document.getElementsByName('atq-select');
        radios.forEach(r => { if(r.value === id) r.checked = true; });

        atualizarUI();
    }

    function selecionarAlvoInimigo(id) {
        if (emTurnoInimigo || unidades[id].hpAtual <= 0) return;
        alvoInimigoId = id;
        atualizarUI();
    }

    function calcularDano(atacante, defensor, habilidade) {
        if (habilidade.elemento === defensor.imunidade) {
            log(`<b style="color:blue;">IMUNE!</b> ${defensor.nome} não recebeu dano.`);
            return 0;
        }
        let danoFinal = habilidade.dano;
        if (habilidade.elemento === defensor.fraqueza) {
            danoFinal += 30;
            log(`<b style="color:red;">FRAQUEZA! (+30 Dano em ${defensor.nome})</b>`);
        }

        // Aplica o escudo da Simbiose (-20 de dano recebido)
        if (defensor.duracaoEscudo > 0) {
            danoFinal = Math.max(0, danoFinal - 20);
            log(`🛡️ <b>ESCUDO DE SIMBIOSE!</b> Dano reduzido em 20 em ${defensor.nome}.`);
        }

        return danoFinal;
    }

    function carregarLimite(unidade, qtd) {
        unidade.limite = Math.min(100, unidade.limite + qtd);
    }

    function executarAcaoJogador(indiceHab) {
        if (emTurnoInimigo) return;

        let atacante = unidades[atacanteAtualId];
        let defensor = unidades[alvoInimigoId];

        if (atacante.hpAtual <= 0) {
            log("O personagem selecionado está derrotado!");
            return;
        }

        let habilidade = (indiceHab === 'limit') ? atacante.limitBreak : atacante.habilidades[indiceHab];

        // Habilidade de Suporte (Simbiose)
        if (habilidade.tipo === 'escudo') {
            atacante.duracaoEscudo = 2; // Concede redução por 2 turnos
            log(`🛡️ <b>${atacante.nome}</b> usou <b>${habilidade.nome}</b> e ganhou um escudo (-20 de dano recebido por 2 turnos)!`);
            carregarLimite(atacante, 20);
        }
        // Quebra de Limite da Ysma (Ataque em Área)
        else if (indiceHab === 'limit' && atacante.modelo === "Ysma") {
            log(`🔥 <b>${atacante.nome}</b> usou <b style="color:#b78103;">${habilidade.nome}</b>!`);
            ['e0', 'e1', 'e2'].forEach(eId => {
                let target = unidades[eId];
                if (target.hpAtual > 0) {
                    let d = calcularDano(atacante, target, habilidade);
                    target.hpAtual = Math.max(0, target.hpAtual - d);
                    log(`  -> <b>${target.nome}</b> recebeu ${d} de dano!`);
                }
            });
            atacante.limite = 0;
        } 
        // Quebra de Limite do Campos (Banquete Simbiótico - Dano + Cura em Área)
        else if (indiceHab === 'limit' && atacante.modelo === "Campos") {
            let dano = calcularDano(atacante, defensor, habilidade);
            defensor.hpAtual = Math.max(0, defensor.hpAtual - dano);
            
            let cura = Math.floor(dano * 0.30);
            log(`🩸 <b>${atacante.nome}</b> usou <b style="color:#b78103;">${habilidade.nome}</b> causando ${dano} de dano em <b>${defensor.nome}</b>!`);
            
            ['p0', 'p1', 'p2'].forEach(pId => {
                let aliado = unidades[pId];
                if (aliado.hpAtual > 0) {
                    aliado.hpAtual = Math.min(aliado.hpMax, aliado.hpAtual + cura);
                    log(`  -> 💖 <b>${aliado.nome}</b> foi curado em ${cura} HP!`);
                }
            });
            atacante.limite = 0;
        }
        // Ataques Padrão
        else {
            let dano = calcularDano(atacante, defensor, habilidade);
            defensor.hpAtual = Math.max(0, defensor.hpAtual - dano);

            carregarLimite(atacante, 25);
            carregarLimite(defensor, 15);

            log(`<b>${atacante.nome}</b> usou <b>${habilidade.nome}</b> em <b>${defensor.nome}</b> causando ${dano} de dano!`);
        }

        // Aplica e consome o Cooldown da habilidade usada
        if (indiceHab !== 'limit' && habilidade.cdMax > 0) {
            habilidade.cdAtual = habilidade.cdMax + 1;
        }

        if (verificarVitoria()) return;
        iniciarTurnoInimigo();
    }

    function iniciarTurnoInimigo() {
        emTurnoInimigo = true;
        document.getElementById('status-header').innerText = 'TURNO INIMIGO...';
        document.getElementById('status-header').style.color = 'red';
        
        // Reduz cooldowns e escudos dos aliados ao passar o turno
        ['p0', 'p1', 'p2'].forEach(pId => {
            let p = unidades[pId];
            if (p.duracaoEscudo > 0) p.duracaoEscudo--;
            p.habilidades.forEach(h => {
                if (h.cdAtual > 0) h.cdAtual--;
            });
        });

        atualizarUI();

        setTimeout(() => {
            let inimigosVivos = ['e0', 'e1', 'e2'].filter(id => unidades[id].hpAtual > 0);
            let aliadosVivos = ['p0', 'p1', 'p2'].filter(id => unidades[id].hpAtual > 0);

            if (inimigosVivos.length > 0 && aliadosVivos.length > 0) {
                let atacanteInimigo = unidades[inimigosVivos[0]];
                let alvoAliado = unidades[aliadosVivos[Math.floor(Math.random() * aliadosVivos.length)]];
                let habInimiga = atacanteInimigo.habilidades[0];

                let dano = calcularDano(atacanteInimigo, alvoAliado, habInimiga);
                alvoAliado.hpAtual = Math.max(0, alvoAliado.hpAtual - dano);

                log(`👹 <b>${atacanteInimigo.nome}</b> atacou <b>${alvoAliado.nome}</b> com <b>${habInimiga.nome}</b> causando ${dano} de dano!`);
            }

            if (verificarDerrota()) return;

            emTurnoInimigo = false;
            document.getElementById('status-header').innerText = 'SEU TURNO';
            document.getElementById('status-header').style.color = '#5c4033';
            
            garantirAtacanteValido();
            garantirAlvoValido();
            atualizarUI();
        }, 1200);
    }

    function garantirAtacanteValido() {
        if (unidades[atacanteAtualId].hpAtual <= 0) {
            let vivo = ['p1', 'p0', 'p2'].find(id => unidades[id].hpAtual > 0);
            if (vivo) selecionarAtacante(vivo);
        }
    }

    function garantirAlvoValido() {
        if (unidades[alvoInimigoId].hpAtual <= 0) {
            let vivo = ['e1', 'e0', 'e2'].find(id => unidades[id].hpAtual > 0);
            if (vivo) alvoInimigoId = vivo;
        }
    }

    function verificarVitoria() {
        let todosInimigosMortos = ['e0', 'e1', 'e2'].every(id => unidades[id].hpAtual <= 0);
        if (todosInimigosMortos) {
            log("<b style='color:green;'>VITÓRIA! O time inimigo foi derrotado.</b>");
            emTurnoInimigo = true;
            atualizarUI();
            return true;
        }
        return false;
    }

    function verificarDerrota() {
        let todosAliadosMortos = ['p0', 'p1', 'p2'].every(id => unidades[id].hpAtual <= 0);
        if (todosAliadosMortos) {
            log("<b style='color:red;'>DERROTA! Seu time foi derrotado.</b>");
            emTurnoInimigo = true;
            atualizarUI();
            return true;
        }
        return false;
    }

    function log(msg) {
        let box = document.getElementById('log-box');
        box.innerHTML += `<br>> ${msg}`;
        box.scrollTop = box.scrollHeight;
    }

    function atualizarUI() {
        for (let id in unidades) {
            let u = unidades[id];
            
            document.getElementById(`name-${id}`).innerText = u.nome;
            document.getElementById(`hp-${id}`).style.width = (u.hpAtual / u.hpMax * 100) + '%';
            document.getElementById(`limit-${id}`).style.width = u.limite + '%';

            let card = document.getElementById(`unit-${id}`);
            card.classList.remove('selected-target', 'active-attacker', 'dead', 'shielded');

            if (u.hpAtual <= 0) {
                card.classList.add('dead');
            }
            if (u.duracaoEscudo > 0) {
                card.classList.add('shielded');
            }
            if (id === alvoInimigoId && id.startsWith('e')) {
                card.classList.add('selected-target');
            }
            if (id === atacanteAtualId && id.startsWith('p')) {
                card.classList.add('active-attacker');
            }
        }

        // Atualizar Botões do Personagem Selecionado
        let atq = unidades[atacanteAtualId];
        atq.habilidades.forEach((h, i) => {
            let btn = document.getElementById(`btn-atq${i+1}`);
            if (btn) {
                let textoCd = h.cdAtual > 0 ? ` (${h.cdA
