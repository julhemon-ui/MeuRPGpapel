<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3v3 Paper RPG - Sistemas</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        body { background-color: #2b2b2b; font-family: 'Courier New', Courier, monospace; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        
        #game-container {
            width: 95%; max-width: 600px; background-color: #f4ecd8;
            background-image: linear-gradient(#999 0.05em, transparent 0.05em), linear-gradient(90deg, #999 0.05em, transparent 0.05em);
            background-size: 20px 20px; border: 6px solid #5c4033; border-radius: 12px; padding: 15px; display: flex; flex-direction: column; gap: 15px;
        }

        .battle-area { display: flex; justify-content: space-around; align-items: center; min-height: 140px; background: rgba(255,255,255,0.4); border-radius: 8px; padding: 10px; }
        .unit-box { text-align: center; width: 120px; }
        .hp-bar, .limit-bar { width: 100%; background: #ccc; height: 12px; border: 1px solid #000; border-radius: 3px; overflow: hidden; margin-top: 4px; }
        .hp-fill { height: 100%; background: #4caf50; width: 100%; transition: width 0.3s; }
        .limit-fill { height: 100%; background: #ffca28; width: 0%; transition: width 0.3s; }

        #log-box { background: #fff; border: 2px solid #5c4033; height: 100px; padding: 8px; font-size: 12px; border-radius: 6px; overflow-y: auto; }
        
        .grid-buttons { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
        button { background: #faf0d7; border: 2px solid #5c4033; padding: 10px 5px; font-weight: bold; font-size: 11px; cursor: pointer; border-radius: 6px; }
        button:disabled { opacity: 0.5; cursor: not-allowed; }
        
        /* Botão do Limit Break */
        #btn-limit { background: #ffecb3; border-color: #b78103; color: #8c5b00; grid-column: span 2; }
        #btn-limit.ready { background: #ff9800; color: #fff; animation: pulse 1s infinite alternate; }

        @keyframes pulse {
            from { transform: scale(1); box-shadow: 0 0 5px #ff9800; }
            to { transform: scale(1.02); box-shadow: 0 0 15px #ff5722; }
        }
    </style>
</head>
<body>

<div id="game-container">
    <h3 style="text-align: center;">📜 Teste de Mecânicas RPG</h3>

    <div class="battle-area">
        <!-- Ysma -->
        <div class="unit-box">
            <strong>Ysma</strong> (Fogo)
            <div class="hp-bar"><div id="ysma-hp" class="hp-fill"></div></div>
            <div style="font-size: 10px; margin-top:3px;">Limite:</div>
            <div class="limit-bar"><div id="ysma-limit" class="limit-fill"></div></div>
        </div>

        <div style="font-size: 20px; font-weight: bold;">VS</div>

        <!-- Inimigo Teste -->
        <div class="unit-box">
            <strong>Golem de Planta</strong>
            <div style="font-size: 10px; color: green;">Tipo: Planta</div>
            <div class="hp-bar"><div id="enemy-hp" class="hp-fill"></div></div>
        </div>
    </div>

    <!-- Log de Combate -->
    <div id="log-box">
        <p>> Batalha iniciada! O inimigo é do tipo Planta.</p>
    </div>

    <!-- Botões de Ação -->
    <div class="grid-buttons">
        <button onclick="usarAtaque('Acerto Perfurante', 15, 'Físico')">Acerto Perfurante (Físico)</button>
        <button onclick="usarAtaque('Bola de Fogo', 30, 'Fogo')">Bola de Fogo (Fogo 🔥)</button>
        <button onclick="usarAtaque('Raio de Gelo', 20, 'Gelo')">Raio de Gelo (Gelo ❄️)</button>
        <button id="btn-limit" disabled onclick="usarLimitBreak()">QUEBRA DE LIMITES (0%)</button>
    </div>
</div>

<script>
    let enemyHpMax = 120, enemyHp = 120, enemyElement = 'Planta';
    let limitValue = 0; // 0 a 100

    // Tabela de Vantagens Simples
    const fraquezas = {
        'Planta': 'Fogo',
        'Água': 'Eletricidade',
        'Fogo': 'Água'
    };

    function log(msg) {
        const box = document.getElementById('log-box');
        box.innerHTML += `<p style="margin-bottom:3px;">> ${msg}</p>`;
        box.scrollTop = box.scrollHeight;
    }

    function ganhaLimite(qtd) {
        limitValue = Math.min(100, limitValue + qtd);
        const limitBar = document.getElementById('ysma-limit');
        const limitBtn = document.getElementById('btn-limit');
        
        limitBar.style.width = limitValue + '%';
        
        if (limitValue >= 100) {
            limitBtn.disabled = false;
            limitBtn.classList.add('ready');
            limitBtn.innerText = '⚡ QUEBRA DE LIMITES PRONTA! ⚡';
        } else {
            limitBtn.innerText = `QUEBRA DE LIMITES (${limitValue}%)`;
        }
    }

    function usarAtaque(nome, danoBase, elemento) {
        let multiplicador = 1.0;
        let msgEfeito = "";

        // Checagem de Tipo
        if (fraquezas[enemyElement] === elemento) {
            multiplicador = 1.5;
            msgEfeito = " <span style='color:red; font-weight:bold;'>[SUPER EFETIVO! +50%]</span>";
        }

        let danoFinal = Math.floor(danoBase * multiplicador);
        enemyHp = Math.max(0, enemyHp - danoFinal);

        document.getElementById('enemy-hp').style.width = (enemyHp / enemyHpMax * 100) + '%';
        
        log(`Ysma usou <strong>${nome}</strong>! Caused <strong>${danoFinal}</strong> de dano.${msgEfeito}`);

        // Aumenta a barra de Limite
        ganhaLimite(25);

        if (enemyHp === 0) {
            log("<strong style='color:green;'>O Golem de Planta foi destruído!</strong>");
        }
    }

    function usarLimitBreak() {
        if (limitValue < 100) return;

        let danoFinal = 80; // Dano massivo
        enemyHp = Math.max(0, enemyHp - danoFinal);
        document.getElementById('enemy-hp').style.width = (enemyHp / enemyHpMax * 100) + '%';

        log(`<strong style='color:purple;'>✨ Ysma ativou a QUEBRA DE LIMITES: Explosão Prisma! Causou ${danoFinal} de dano elemental puro!</strong>`);

        // Reseta Limite
        limitValue = 0;
        document.getElementById('ysma-limit').style.width = '0%';
        const limitBtn = document.getElementById('btn-limit');
        limitBtn.disabled = true;
        limitBtn.classList.remove('ready');
        limitBtn.innerText = 'QUEBRA DE LIMITES (0%)';
    }
</script>

</body>
</html>
