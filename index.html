<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3v3 Paper RPG - Sistema de Seleção Corrigido</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        body { background: #1a1a1a; font-family: 'Courier New', Courier, monospace; color: #333; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        
        #game-container {
            width: 100%; max-width: 650px; background: #f4ecd8;
            background-image: linear-gradient(#ccc 0.05em, transparent 0.05em), linear-gradient(90deg, #ccc 0.05em, transparent 0.05em);
            background-size: 20px 20px; border: 5px solid #5c4033; border-radius: 12px; padding: 12px; display: flex; flex-direction: column; gap: 10px;
        }

        /* Arena PvP */
        .field { display: flex; justify-content: space-between; background: rgba(0,0,0,0.05); border: 2px dashed #8b5a2b; border-radius: 8px; padding: 10px; height: 210px; position: relative; }
        .team-side { width: 48%; height: 100%; position: relative; }
        
        /* Posições */
        .ally-side .pos-back-top { position: absolute; left: 5%; top: 5%; }
        .ally-side .pos-front { position: absolute; left: 55%; top: 35%; }
        .ally-side .pos-back-bottom { position: absolute; left: 5%; bottom: 5%; }

        .enemy-side .pos-back-top { position: absolute; right: 5%; top: 5%; }
        .enemy-side .pos-front { position: absolute; right: 55%; top: 35%; }
        .enemy-side .pos-back-bottom { position: absolute; right: 5%; bottom: 5%; }

        /* Card de Unidade */
        .unit-card {
            width: 85px; background: #fff8dc; border: 2px solid #5c4033; border-radius: 6px; padding: 5px; text-align: center;
            font-size: 10px; position: relative; transition: all 0.2s;
        }
        .unit-card.active-attacker { border: 3px solid #f1c40f !important; box-shadow: 0 0 10px #f1c40f; }
        .unit-card.active-target { border: 3px solid #d32f2f !important; box-shadow: 0 0 10px #d32f2f; }
        .unit-card.dead { opacity: 0.3; filter: grayscale(100%); }

        /* Status Badge */
        .status-badge { font-size: 8px; font-weight: bold; margin-top: 2px; height: 12px; }

        /* Barras de Status */
        .bar-bg { width: 100%; background: #ddd; height: 8px; border: 1px solid #000; border-radius: 2px; margin-top: 2px; overflow: hidden; }
        .fill-hp { height: 100%; background: #4caf50; width: 100%; transition: width 0.3s; }
        .fill-limit { height: 100%; background: #ffca28; width: 0%; transition: width 0.3s; }

        #status-header { text-align: center; font-weight: bold; font-size: 14px; color: #5c4033; }
        #log-box { background: #fff; border: 2px solid #5c4033; height: 80px; padding: 6px; font-size: 11px; overflow-y: auto; border-radius: 4px; }
        
        /* Controles e Seletores */
        .controls-section { display: flex; flex-direction: column; gap: 8px; }
        .selector-row { display: flex; justify-content: space-between; align-items: center; background: #e8dfc8; padding: 6px; border-radius: 6px; border: 1px solid #8b5a2b; font-size: 11px; font-weight: bold; }
        .btn-group { display: flex; gap: 4px; }
        .btn-select { padding: 4px 8px; font-size: 10px; background: #fff8dc; border: 1px solid #5c4033; border-radius: 4px; cursor: pointer; }
        .btn-select.active { background: #5c4033; color: #fff; font-weight: bold; }

        .action-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
        button { background: #fff8dc; border: 2px solid #5c4033; padding: 8px 4px; font-weight: bold; font-size: 10px; cursor: pointer; border-radius: 4px; }
        button:disabled { opacity: 0.5; background: #ccc; cursor: not-allowed; }
        #btn-limit { grid-column: span 2; background: #ffecb3; border-color: #b78103; color: #8c5b00; }
        #btn-limit.ready { background: #ff9800; color: #fff; }
    </style>
</head>
<body>

<div id="game-container">
    <div id="status-header">SEU TURNO</div>

    <!-- Arena 3v3 -->
    <div class="field">
        <!-- Time do Jogador -->
        <div class="team-side ally-side">
            <div id="unit-p0" class="unit-card pos-back-top">
                <div id="name-p0">Dunnie</div>
                <div class="bar-bg"><div id="hp-p0" class="fill-hp"></div></div>
                <div class="bar-bg"><div id="limit-p0" class="fill-limit"></div></div>
                <div id="status-p0" class="status-badge"></div>
            </div>
            <div id="unit-p1" class="unit-card pos-front">
                <div id="name-p1">Campos</div>
                <div class="bar-bg"><div id="hp-p1" class="fill-hp"></div></div>
                <div class="bar-bg"><div id="limit-p1" class="fill-limit"></div></div>
                <div id="status-p1" class="status-badge"></div>
            </div>
            <div id="unit-p2" class="unit-card pos-back-bottom">
                <div id="name-p2">Ysma</div>
                <div class="bar-bg"><div id="hp-p2" class="fill-hp"></div></div>
                <div class="bar-bg"><div id="limit-p2" class="fill-limit"></div></div>
                <div id="status-p2" class="status-badge"></div>
            </div>
        </div>

        <!-- Time Inimigo -->
        <div class="team-side enemy-side">
            <div id="unit-e0" class="unit-card pos-back-top">
                <div id="name-e0">Dunnie (E)</div>
                <div class="bar-bg"><div id="hp-e0" class="fill-hp"></div></div>
                <div class="bar-bg"><div id="limit-e0" class="fill-limit"></div></div>
                <div id="status-e0" class="status-badge"></div>
            </div>
            <div id="unit-e1" class="unit-card pos-front">
                <div id="name-e1">Campos (E)</div>
                <div class="bar-bg"><div id="hp-e1" class="fill-hp"></div></div>
                <div class="bar-bg"><div id="limit-e1" class="fill-limit"></div></div>
                <div id="status-e1" class="status-badge"></div>
            </div>
            <div id="unit-e2" class="unit-card pos-back-bottom">
                <div id="name-e2">Ysma (E)</div>
                <div class="bar-bg"><div id="hp-e2" class="fill-hp"></div></div>
                <div class="bar-bg"><div id="limit-e2" class="fill-limit"></div></div>
                <div id="status-e2" class="status-badge"></div>
            </div>
        </div>
    </div>

    <!-- Log de Ações -->
    <div id="log-box">> Batalha iniciada! Escolha quem vai agir e o alvo.</div>

    <!-- Painel de Seleção -->
    <div class="controls-section">
        <div class="selector-row">
            <span>Quem vai agir:</span>
            <div class="btn-group">
                <button id="sel-p0" class="btn-select" onclick="selecionarAtacante('p0')">Dunnie</button>
                <button id="sel-p1" class="btn-select" onclick="selecionarAtacante('p1')">Campos</button>
                <button id="sel-p2" class="btn-select" onclick="selecionarAtacante('p2')">Ysma</button>
            </div>
        </div>

        <div class="selector-row">
            <span>Alvo do Ataque:</span>
            <div class="btn-group">
                <button id="sel-e0" class="btn-select" onclick="selecionarAlvo('e0')">Dunnie (E)</button>
                <button id="sel-e1" class="btn-select" onclick="selecionarAlvo('e1')">Campos (E)</button>
                <button id="sel-e2" class="btn-select" onclick="selecionarAlvo('e2')">Ysma (E)</button>
            </div>
        </div>
    </div>

    <!-- Painel de Ações -->
    <div class="action-grid">
        <button id="btn-atq1" onclick="executarAcao(0)">Habilidade 1</button>
        <button id="btn-atq2" onclick="executarAcao(1)">Habilidade 2</button>
        <button id="btn-atq3" onclick="executarAcao(2)">Habilidade 3</button>
        <button id="btn-atq4" onclick="executarAcao(3)">Habilidade 4</button>
        <button id="btn-limit" disabled onclick="executarAcao('limit')">QUEBRA DE LIMITES (0%)</button>
    </div>
</div>

<script>
    // 1. BANCO DE DADOS
    const BANCO_DE_DADOS_PERSONAGENS = {
        "Dunnie": {
            hpMax: 100, danoFisico: 20, elementoBase: "Físico", fraqueza: "Biológico", imunidade: "Purificação",
            habilidades: [
                { nome: "Acerto Perfurante", dano: 20, elemento: "Físico", cdMax: 0, cdAtual: 0, tipo: "ataque" },
                { nome: "Preparo", dano: 0, elemento: "Físico", cdMax: 2, cdAtual: 0, tipo: "self_buff" },
                { nome: "Ataque Rápido", dano: 30, elemento: "Físico", cdMax: 2, cdAtual: 0, tipo: "ataque" },
                { nome: "Exílio dos Antigos", dano: 25, elemento: "Biológico", cdMax: 5, cdAtual: 0, tipo: "ataque", efeito: "veneno", chanceEfeito: 30 }
            ],
            limitBreak: { nome: "Força dos Antigos", dano: 50, elemento: "Biológico", tipo: "limit_aoe", efeito: "veneno", chanceEfeito: 50 }
        },
        "Ysma": {
            hpMax: 100, danoFisico: 15, elementoBase: "Mágico", fraqueza: "Purificação", imunidade: "Fogo",
            habilidades: [
                { nome: "Acerto Perfurante", dano: 15, elemento: "Físico", cdMax: 0, cdAtual: 0, tipo: "ataque" },
                { nome: "Bola de Fogo", dano: 35, elemento: "Fogo", cdMax: 2, cdAtual: 0, tipo: "ataque", efeito: "queimadura", chanceEfeito: 10 },
                { nome: "Raio de Gelo", dano: 10, elemento: "Gelo", cdMax: 4, cdAtual: 0, tipo: "ataque", efeito: "congelamento", chanceEfeito: 40 },
                { nome: "Furacão", dano: 25, elemento: "Vento", cdMax: 4, cdAtual: 0, tipo: "ataque", efeito: "leve" }
            ],
            limitBreak: { nome: "Explosão de Cristal Prisma", dano: 50, elemento: "Mágico", tipo: "limit_padrao" }
        },
        "Campos": {
            hpMax: 200, danoFisico: 20, elementoBase: "Corrupção", fraqueza: "Nenhuma", imunidade: "Nenhuma",
            habilidades: [
                { nome: "Gavras Vorazes", dano: 20, elemento: "Físico", cdMax: 0, cdAtual: 0, tipo: "ataque" },
                { nome: "Surto Corrupto", dano: 40, elemento: "Corrupção", cdMax: 3, cdAtual: 0, tipo: "ataque" },
                { nome: "Simbiose", dano: 0, elemento: "Suporte", cdMax: 4, cdAtual: 0, tipo: "buff_aliado" },
                { nome: "Laceração", dano: 20, elemento: "Corrupção", cdMax: 3, cdAtual: 0, tipo: "ataque", efeito: "sangramento" }
            ],
            limitBreak: { nome: "Banquete Simbiótico", dano: 60, elemento: "Corrupção", tipo: "limit_banquete" }
        }
    };

    // 2. ESTADO DA BATALHA
    let unidades = {
        'p0': criarInstancia("Dunnie", "p0"),
        'p1': criarInstancia("Campos", "p1"),
        'p2': criarInstancia("Ysma", "p2"),
        'e0': criarInstancia("Dunnie", "e0"),
        'e1': criarInstancia("Campos", "e1"),
        'e2': criarInstancia("Ysma", "e2")
    };

    let atacanteAtualId = 'p0';
    let alvoInimigoId = 'e1';
    let emTurnoInimigo = false;

    function criarInstancia(nomeModelo, id) {
        let base = BANCO_DE_DADOS_PERSONAGENS[nomeModelo];
        return {
            id: id, nome: nomeModelo, hpMax: base.hpMax, hpAtual: base.hpMax,
            danoFisico: base.danoFisico, fraqueza: base.fraqueza, imunidade: base.imunidade,
            limite: 0, habilidades: JSON.parse(JSON.stringify(base.habilidades)),
            limitBreak: JSON.parse(JSON.stringify(base.limitBreak)),
            escudoSimbiose: 0, escudoPreparo: 0, sangramento: 0, queimadura: 0, congelado: false, leve: 0, veneno: 0
        };
    }

    // 3. SELEÇÃO
    function selecionarAtacante(id) {
        if (emTurnoInimigo || unidades[id].hpAtual <= 0) return;
        atacanteAtualId = id;
        atualizarUI();
    }

    function selecionarAlvo(id) {
        if (emTurnoInimigo || unidades[id].hpAtual <= 0) return;
        alvoInimigoId = id;
        atualizarUI();
    }

    // 4. COMBATE
    function calcularDano(atacante, defensor, habilidade) {
        if (habilidade.elemento === defensor.imunidade) {
            log(`<b style="color:blue;">IMUNE!</b> ${defensor.nome} não recebeu dano.`);
            return 0;
        }

        let danoBase = habilidade.dano;

        if (habilidade.elemento === "Vento" && defensor.leve > 0) {
            danoBase += 20;
            log(`💨 <b>BÔNUS LEVE!</b> (+20 Dano em ${defensor.nome})`);
        }

        if (habilidade.elemento === defensor.fraqueza) {
            danoBase += 30;
            log(`<b style="color:red;">FRAQUEZA! (+30 Dano em ${defensor.nome})</b>`);
        }

        if (defensor.escudoPreparo > 0 && danoBase > 0) {
            danoBase = Math.max(0, danoBase - 30);
            log(`🛡️ <b>Preparo</b> reduziu o dano em 30 no ${defensor.nome}!`);
        }

        if (defensor.escudoSimbiose > 0 && danoBase > 0) {
            danoBase = Math.max(0, danoBase - 20);
            log(`🛡️ <b>Simbiose</b> reduziu o dano em 20 no ${defensor.nome}!`);
        }

        return danoBase;
    }

    function carregarLimite(unidade, qtd) {
        unidade.limite = Math.min(100, unidade.limite + qtd);
    }

    function aplicarDanoPosAtaque(unidade) {
        if (unidade.hpAtual > 0 && unidade.queimadura > 0) {
            unidade.hpAtual = Math.max(0, unidade.hpAtual - 10);
            log(`🔥 <b>${unidade.nome}</b> sofreu 10 de dano por Queimadura após agir!`);
        }
    }

    function executarAcao(indiceHab) {
        if (emTurnoInimigo) return;

        let atacante = unidades[atacanteAtualId];
        let defensor = unidades[alvoInimigoId];

        if (atacante.hpAtual <= 0) {
            log("Escolha um personagem vivo para agir!");
            return;
        }

        if (atacante.congelado) {
            log(`❄ <b>${atacante.nome}</b> está congelado e perdeu a vez!`);
            atacante.congelado = false;
            iniciarTurnoInimigo();
            return;
        }

        let habilidade = (indiceHab === 'limit') ? atacante.limitBreak : atacante.habilidades[indiceHab];

        // Dunnie: Preparo
        if (habilidade.tipo === 'self_buff') {
            atacante.escudoPreparo = 2;
            atacante.hpAtual = Math.min(atacante.hpMax, atacante.hpAtual + 30);
            habilidade.cdAtual = habilidade.cdMax + 1;
            carregarLimite(atacante, 15);
            log(`🛡 <b>${atacante.nome}</b> usou <b>Preparo</b>! Curou 30 HP e ganhou escudo de -30 de dano.`);
            aplicarDanoPosAtaque(atacante);
            if (verificarVitoria()) return;
            iniciarTurnoInimigo();
            return;
        }

        // Campos: Simbiose
        if (habilidade.tipo === 'buff_aliado') {
            atacante.escudoSimbiose = 2;
            habilidade.cdAtual = habilidade.cdMax + 1;
            carregarLimite(atacante, 15);
            log(`🛡 <b>${atacante.nome}</b> ativou <b>Simbiose</b>! (-20 de dano pelos próximos 2 turnos)`);
            aplicarDanoPosAtaque(atacante);
            if (verificarVitoria()) return;
            iniciarTurnoInimigo();
            return;
        }

        // Dunnie: Limit Break AoE
        if (habilidade.tipo === 'limit_aoe') {
            log(`💥 <b>${atacante.nome}</b> usou <b style="color:#b78103;">${habilidade.nome}</b> atingindo TODOS os inimigos!`);
            atacante.limite = 0;

            ['e0', 'e1', 'e2'].forEach(eId => {
                let inimigo = unidades[eId];
                if (inimigo.hpAtual > 0) {
                    let dano = calcularDano(atacante, inimigo, habilidade);
                    inimigo.hpAtual = Math.max(0, inimigo.hpAtual - dano);
                    log(`  🎯 ${inimigo.nome} recebeu ${dano} de dano!`);

                    if (Math.random() * 100 < habilidade.chanceEfeito) {
                        inimigo.veneno = 6;
                        log(`  ☠️ <b>${inimigo.nome}</b> foi ENVENENADO por 6 turnos!`);
                    }
                }
            });

        } else if (habilidade.tipo === 'limit_banquete') {
            let dano = calcularDano(atacante, defensor, habilidade);
            defensor.hpAtual = Math.max(0, defensor.hpAtual - dano);
            atacante.limite = 0;
            let cura = Math.round(dano * 0.30);

            log(`🔥 <b>${atacante.nome}</b> usou <b style="color:#b78103;">Banquete Simbiótico</b> causando ${dano} de dano em <b>${defensor.nome}</b>!`);
            ['p0', 'p1', 'p2'].forEach(pId => {
                if (unidades[pId].hpAtual > 0) unidades[pId].hpAtual = Math.min(unidades[pId].hpMax, unidades[pId].hpAtual + cura);
            });

        } else {
            // Ataques Normais
            if (!defensor || defensor.hpAtual <= 0) {
                log("Escolha um inimigo vivo como alvo!");
                return;
            }

            let dano = calcularDano(atacante, defensor, habilidade);
            defensor.hpAtual = Math.max(0, defensor.hpAtual - dano);

            if (indiceHab === 'limit') {
                atacante.limite = 0;
            } else {
                carregarLimite(atacante, 25);
                carregarLimite(defensor, 15);
                if (habilidade.cdMax > 0) habilidade.cdAtual = habilidade.cdMax + 1;
            }

            log(`<b>${atacante.nome}</b> usou <b>${habilidade.nome}</b> em <b>${defensor.nome}</b> causando ${dano} de dano!`);

            if (habilidade.efeito === 'sangramento') defensor.sangramento = 3;
            else if (habilidade.efeito === 'queimadura' && Math.random() * 100 < habilidade.chanceEfeito) defensor.queimadura = 2;
            else if (habilidade.efeito === 'congelamento' && Math.random() * 100 < habilidade.chanceEfeito) defensor.congelado = true;
            else if (habilidade.efeito === 'leve') defensor.leve = 2;
            else if (habilidade.efeito === 'veneno' && Math.random() * 100 < habilidade.chanceEfeito) {
                defensor.veneno = 6;
                log(`☠️ <b>${defensor.nome}</b> foi ENVENENADO por 6 turnos!`);
            }
        }

        aplicarDanoPosAtaque(atacante);
        if (verificarVitoria()) return;
        iniciarTurnoInimigo();
    }

    // 5. STATUS
    function processarEfeitosStatus() {
        for (let id in unidades) {
            let u = unidades[id];
            if (u.hpAtual <= 0) continue;

            if (u.sangramento > 0) {
                u.hpAtual = Math.max(0, u.hpAtual - 10);
                u.sangramento--;
                log(`🩸 <b>${u.nome}</b> sofreu 10 de dano por Sangramento!`);
            }

            if (u.veneno > 0) {
                u.hpAtual = Math.max(0, u.hpAtual - 10);
                u.veneno--;
                log(`☠️ <b>${u.nome}</b> sofreu 10 de dano por Veneno! (${u.veneno}T restantes)`);
            }

            if (u.queimadura > 0) u.queimadura--;
            if (u.leve > 0) u.leve--;
            if (u.escudoSimbiose > 0) u.escudoSimbiose--;
            if (u.escudoPreparo > 0) u.escudoPreparo--;
        }
    }

    // 6. IA DO INIMIGO
    function iniciarTurnoInimigo() {
        emTurnoInimigo = true;
        document.getElementById('status-header').innerText = 'TURNO INIMIGO...';
        document.getElementById('status-header').style.color = 'red';

        unidades[atacanteAtualId].habilidades.forEach(h => { if (h.cdAtual > 0) h.cdAtual--; });

        processarEfeitosStatus();
        atualizarUI();

        if (verificarVitoria() || verificarDerrota()) return;

        setTimeout(() => {
            let inimigosVivos = ['e0', 'e1', 'e2'].filter(id => unidades[id].hpAtual > 0);
            let aliadosVivos = ['p0', 'p1', 'p2'].filter(id => unidades[id].hpAtual > 0);

            if (inimigosVivos.length > 0 && aliadosVivos.length > 0) {
                let idInimigo = inimigosVivos[Math.floor(Math.random() * inimigosVivos.length)];
                let atacanteInimigo = unidades[idInimigo];

                atacanteInimigo.habilidades.forEach(h => { if(h.cdAtual > 0) h.cdAtual--;
